<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>永進機械交貨預約系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  @keyframes slide-in { from { transform: translateX(1rem); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(0.5rem); } to { opacity: 1; transform: translateY(0); } }
  .animate-slide-in { animation: slide-in .25s ease-out; }
  .animate-fade-in { animation: fade-in .3s ease-out; }
  body { margin: 0; }
  /* 列印「中午新增預約清單」時只印清單本身 */
  @media print {
    body * { visibility: hidden !important; }
    #noon-print, #noon-print * { visibility: visible !important; }
    #noon-print { position: absolute; left: 0; top: 0; width: 100%; padding: 16px; background: #fff; }
    #noon-print table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #noon-print th, #noon-print td { border: 1px solid #999; padding: 6px 8px; text-align: left; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-gray-900">
<div id="app"></div>

<script>
'use strict';

/* ============================================================
 * 設定：請把下面這行換成你部署 Apps Script 後拿到的 Web App 網址
 * （見附上的《SETUP-GUIDE.md》）
 * ============================================================ */
var API_URL = 'https://script.google.com/macros/s/AKfycbwWPL8YD_MwzE1DJZGz6TfeQH3RJkrMlQ2No7TRthQqcCY1l6ljxPdmOZ4p7Fbep716/exec';

/* ============================================================
 * 常數（對應原本 src/utils/constants.js）
 * ============================================================ */
var LOCATIONS = [
  { id: 'general', name: '一般類-中門收貨站' },
  { id: 'sheet_metal', name: '控管類-鈑金倉' },
  { id: 'electronics', name: '電裝倉' },
  { id: 'casting', name: '鑄件類' },
  { id: 'parcel', name: '包裹類' },
]
var LOCATION_ICON = { general: 'door-open', sheet_metal: 'box', electronics: 'cpu', casting: 'factory', parcel: 'package' }
var PARCEL_LOCATION = '包裹類'
var PARCEL_ONLY_SLOT = '上午11:30~12:00'
var TIME_SLOTS = [
  '上午08:30~09:00', '上午09:00~10:00', '上午10:00~11:00', '上午11:00~11:30', '上午11:30~12:00',
  '下午13:00~14:00', '下午14:00~15:00', '下午15:00~16:00',
]
var DEFAULT_SLOT_CAPACITY = 10

/* ============================================================
 * 小工具
 * ============================================================ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  })
}
function qs(sel, root) { return (root || document).querySelector(sel) }
function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)) }
function refreshIcons() { if (window.lucide) window.lucide.createIcons() }

var XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
var XLSX_SRI = 'sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw'
function loadXLSX() {
  return new Promise(function (resolve, reject) {
    if (window.XLSX) return resolve(window.XLSX)
    var script = document.createElement('script')
    script.src = XLSX_URL
    script.integrity = XLSX_SRI
    script.crossOrigin = 'anonymous'
    script.referrerPolicy = 'no-referrer'
    script.onload = function () { window.XLSX ? resolve(window.XLSX) : reject(new Error('XLSX load failed')) }
    script.onerror = function () { reject(new Error('XLSX script blocked or tampered (SRI mismatch)')) }
    document.head.appendChild(script)
  })
}

/* ============================================================
 * 後端 API
 * ============================================================ */
function apiConfigured() { return API_URL && API_URL.indexOf('PASTE_YOUR') === -1 }

function api(action, payload) {
  if (!apiConfigured()) return Promise.reject(new Error('尚未設定後端網址，請參考《SETUP-GUIDE.md》完成部署'))
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: action, payload: payload || {} }) })
    .then(function (res) { return res.json() })
    .then(function (json) {
      if (!json || !json.ok) throw new Error((json && json.error) || 'REQUEST_FAILED')
      return json.data
    })
}

/* ============================================================
 * 日期工具（對應原本 src/utils/dates.js；僅供前端即時提示，
 * 正式規則一律以後端伺服器時間為準）
 * ============================================================ */
function formatDateObj(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') }
function todayStr() { return formatDateObj(new Date()) }
function addDaysStr(days, base) {
  var d = base ? new Date(base + 'T00:00:00') : new Date()
  d.setDate(d.getDate() + days)
  return formatDateObj(d)
}
function minBookableDateStr() { return todayStr() }
function maxBookableDateStr() { return addDaysStr(30) }
function isWeekend(dateStr) { var day = new Date(dateStr + 'T00:00:00').getDay(); return day === 0 || day === 6 }
function cutoffHint(dateStr, timeSlot) {
  var now = new Date()
  if (dateStr !== todayStr()) return { locked: false }
  var minutesNow = now.getHours() * 60 + now.getMinutes()
  if (minutesNow >= 12 * 60 + 45) return { locked: true, reason: '今日出單時間已過 (12:45)，無法異動' }
  if (minutesNow >= 7 * 60 + 45 && (!timeSlot || timeSlot.indexOf('上午') >= 0)) return { locked: true, reason: '早上出單時間已過 (07:45)，上午時段已鎖定' }
  return { locked: false }
}
function displayDate(dateStr) { return dateStr ? dateStr.replace(/-/g, '/') : '' }
function formatTimestamp(ts) {
  if (!ts) return '-'
  var d = new Date(ts)
  if (isNaN(d.getTime())) return '-'
  return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0')
}

/* ============================================================
 * 預約可用性計算（忠實移植自原本 src/utils/availability.js，
 * 與 Code.gs 內的同名邏輯保持一致 — 這裡只做「即時顯示用」的鏡像，
 * 真正的名額與時限判斷一律由後端在寫入當下重新計算把關）
 * ============================================================ */
function slotMatchesScope(slot, scope) {
  if (scope === 'all_day') return true
  if (scope === 'am') return slot.indexOf('上午') >= 0
  if (scope === 'pm') return slot.indexOf('下午') >= 0
  return false
}
function ruleActiveOnDate(r, date) { return r.type === 'global' ? true : !(date < r.startDate || date > r.endDate) }
function ruleCoversAll(r) { return !r.categories || r.categories.length === 0 || r.categories.indexOf('all') >= 0 }
function bookingHitsRule(locs, r) { return ruleCoversAll(r) || locs.some(function (l) { return r.categories.indexOf(l) >= 0 }) }
// slotCounts[slot] = 該時段每筆有效預約的地點清單陣列（相容舊格式數字：視為地點不明、全部計入）
function slotBookingsList(slotCounts, slot) {
  var v = slotCounts && slotCounts[slot]
  if (Array.isArray(v)) return v
  if (typeof v === 'number') { var out = []; for (var i = 0; i < v; i++) out.push(null); return out }
  return []
}
function countBookings(slotBookings, editingLocs, pred) {
  var n = 0
  slotBookings.forEach(function (locs) { if (locs === null || pred(locs)) n++ })
  if (editingLocs && pred(editingLocs)) n = Math.max(0, n - 1)
  return n
}
function computeAvailability(opts) {
  var date = opts.date, locations = opts.locations || [], rules = opts.rules || [], slotCounts = opts.slotCounts || {}
  var editingSlot = opts.editingSlot, includeCutoff = !!opts.includeCutoff
  var availability = {}
  TIME_SLOTS.forEach(function (slot) { availability[slot] = { available: true, remaining: DEFAULT_SLOT_CAPACITY, reason: '' } })
  if (!date) return { availability: availability, messages: [], dayBlocked: false }

  var messages = []
  var dayBlocked = false

  if (isWeekend(date)) {
    dayBlocked = true
    messages.push(displayDate(date) + ' 為非工作日 (週末)')
    TIME_SLOTS.forEach(function (slot) { availability[slot].available = false; availability[slot].reason = '週末' })
  }

  // 規則是否套用到「目前勾選的地點」：含「全部類別」一律套用，否則要與勾選地點有重疊（全域預設 / 特定條件皆同）
  var applicable = rules.filter(function (r) {
    if (!ruleActiveOnDate(r, date)) return false
    return ruleCoversAll(r) || (locations.length > 0 && r.categories.some(function (c) { return locations.indexOf(c) >= 0 }))
  })

  applicable.filter(function (r) { return r.mode === 'block' }).forEach(function (rule) {
    if (rule.timeScope === 'all_day') {
      dayBlocked = true
      messages.push(displayDate(date) + ' 因 ' + rule.reason + ' 全日暫停預約')
      TIME_SLOTS.forEach(function (slot) { availability[slot].available = false; availability[slot].reason = rule.reason })
    } else {
      var label = rule.timeScope === 'am' ? '上午' : '下午'
      messages.push(displayDate(date) + ' ' + label + ' 因 ' + rule.reason + ' 暫停預約')
      TIME_SLOTS.forEach(function (slot) { if (slotMatchesScope(slot, rule.timeScope)) { availability[slot].available = false; availability[slot].reason = rule.reason } })
    }
  })

  if (includeCutoff) {
    var cutoffBlockedDay = false
    TIME_SLOTS.forEach(function (slot) {
      var lock = cutoffHint(date, slot)
      if (lock.locked) {
        availability[slot].available = false
        if (!availability[slot].reason) availability[slot].reason = '已過時限'
        if (lock.reason.indexOf('今日出單') >= 0) { dayBlocked = true; cutoffBlockedDay = true }
      }
    })
    if (cutoffBlockedDay) messages.push('今日出單時間已過 (12:45)，今日已無法預約，請選擇其他日期')
  }

  if (!dayBlocked) {
    var limitRules = applicable.filter(function (r) { return r.mode === 'limit' })
    TIME_SLOTS.forEach(function (slot) {
      if (!availability[slot].available) return
      var slotBookings = slotBookingsList(slotCounts, slot)
      var editing = editingSlot && editingSlot.date === date && editingSlot.time === slot
      var editingLocs = editing ? (editingSlot.locations || []) : null
      var pools = []
      // (1) 每條限額規則各自一個名額池：已用 = 該時段「有勾到該規則任一適用類別」的預約筆數（同一筆只算一次）
      limitRules.forEach(function (r) {
        if (r.type !== 'global' && !slotMatchesScope(slot, r.timeScope)) return
        var used = countBookings(slotBookings, editingLocs, function (locs) { return bookingHitsRule(locs, r) })
        pools.push({ capacity: parseInt(r.limit, 10), used: used, label: ruleCoversAll(r) ? '' : r.categories.join('/') })
      })
      // (2) 沒被任何限額規則涵蓋的地點，各自用系統預設容量、各自獨立計算
      locations.forEach(function (loc) {
        var covered = limitRules.some(function (r) {
          return (r.type === 'global' || slotMatchesScope(slot, r.timeScope)) && (ruleCoversAll(r) || r.categories.indexOf(loc) >= 0)
        })
        if (covered) return
        var used = countBookings(slotBookings, editingLocs, function (locs) { return locs.indexOf(loc) >= 0 })
        pools.push({ capacity: DEFAULT_SLOT_CAPACITY, used: used, label: loc })
      })
      if (pools.length === 0) pools.push({ capacity: DEFAULT_SLOT_CAPACITY, used: 0, label: '' })
      // 該時段剩餘 = 所有相關名額池中最少的那一個
      var tightest = pools[0]
      pools.forEach(function (p) { if (p.capacity - p.used < tightest.capacity - tightest.used) tightest = p })
      var remaining = Math.max(0, tightest.capacity - tightest.used)
      availability[slot].remaining = remaining
      availability[slot].capacity = tightest.capacity
      if (remaining <= 0) { availability[slot].available = false; availability[slot].reason = '已額滿' + (tightest.label && locations.length > 1 ? '（' + tightest.label + '）' : '') }
    })
  }

  var parcelSelected = locations.indexOf(PARCEL_LOCATION) >= 0
  TIME_SLOTS.forEach(function (slot) {
    var isParcelSlot = slot === PARCEL_ONLY_SLOT
    if (parcelSelected && !isParcelSlot) { availability[slot].available = false; availability[slot].reason = availability[slot].reason || '包裹類僅開放此時段' }
    else if (!parcelSelected && isParcelSlot) { availability[slot].available = false; availability[slot].reason = availability[slot].reason || '此時段僅供包裹類使用' }
  })

  return { availability: availability, messages: messages, dayBlocked: dayBlocked }
}

/* ============================================================
 * 全域資料快取（開站時抓一次，各分頁共用）
 * ============================================================ */
var GLOBAL = { suppliers: [], rules: [], announcements: [], config: { minDate: minBookableDateStr(), maxDate: maxBookableDateStr() }, loaded: false }

function loadBootstrap() {
  return api('bootstrap').then(function (data) {
    GLOBAL.suppliers = data.suppliers || []
    GLOBAL.rules = data.rules || []
    GLOBAL.announcements = data.announcements || []
    GLOBAL.config = data.config || GLOBAL.config
    GLOBAL.loaded = true
  })
}
function refreshAnnouncements(cb) {
  api('listAnnouncements').then(function (data) { GLOBAL.announcements = data.announcements || []; if (cb) cb() }).catch(function () {})
}
// 公告橫幅：顯示在預約交貨 / 管理預約頁最上方，內容由後台「公告設定」維護
function renderAnnouncementBanner() {
  var list = GLOBAL.announcements || []
  if (list.length === 0) return ''
  return '' +
    '<div class="space-y-3 mb-6">' +
    list.map(function (a) {
      return '' +
        '<div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 shadow-sm flex items-start gap-3">' +
        '<i data-lucide="megaphone" class="h-5 w-5 text-amber-600 shrink-0 mt-0.5"></i>' +
        '<p class="text-sm text-amber-900 whitespace-pre-wrap">' + esc(a.message) + '</p></div>'
    }).join('') +
    '</div>'
}
function watchRulesPoll(cb) {
  loadBootstrap().then(function () { cb(GLOBAL.rules) }).catch(function () {})
  return setInterval(function () {
    api('bootstrap').then(function (data) {
      GLOBAL.suppliers = data.suppliers || []
      GLOBAL.rules = data.rules || []
      GLOBAL.config = data.config || GLOBAL.config
      cb(GLOBAL.rules)
    }).catch(function () {})
  }, 30000)
}

/* ============================================================
 * 管理預約（對應原本 ManageBookings.jsx）
 * ============================================================ */
var mb = {
  host: null,
  state: {
    email: '', code: '', loading: false, error: '', results: [],
    editingId: null, editForm: {}, saving: false, cancellingId: null, slotCounts: {},
  },

  mount: function (host) {
    mb.host = host
    mb.state = { email: '', code: '', loading: false, error: '', results: [], editingId: null, editForm: {}, saving: false, cancellingId: null, slotCounts: {} }
    if (!GLOBAL.loaded) loadBootstrap().then(mb.render).catch(function () {})
    mb.render()
  },

  editAvailability: function (booking) {
    if (!mb.state.editingId) return { availability: {}, dayBlocked: false }
    // editingSlot 傳「這筆預約原本的日期/時段/地點」，讓它自己原本佔的名額不會卡到自己
    var orig = booking || mb.state.results.filter(function (b) { return b.id === mb.state.editingId })[0] || {}
    return computeAvailability({
      date: mb.state.editForm.date, locations: mb.state.editForm.locations, rules: GLOBAL.rules, slotCounts: mb.state.slotCounts,
      editingSlot: { date: orig.date, time: orig.time, locations: orig.locations || [] }, includeCutoff: true,
    })
  },

  render: function () {
    if (!mb.host) return
    var s = mb.state
    mb.host.innerHTML = '' +
      '<div class="max-w-xl mx-auto mt-8">' +
      renderAnnouncementBanner() +
      '<div class="p-6 bg-white rounded-2xl shadow-lg border border-gray-100">' +
      '<div class="mb-8 border-b pb-6"><h2 class="text-2xl font-bold text-gray-800 flex items-center gap-3"><i data-lucide="clipboard-list" class="h-6 w-6 text-purple-600"></i> 管理預約</h2>' +
      '<p class="text-gray-500 mt-2">輸入預約時的 Email <span class="text-purple-600 font-bold">或</span> 預約代碼即可查詢。</p></div>' +

      '<form data-onsubmit="search" class="space-y-6 mb-8"><div class="grid grid-cols-1 gap-4">' +
      '<input type="email" data-oninput="email" value="' + esc(s.email) + '" class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-purple-500" placeholder="Email 電子信箱" />' +
      '<div class="text-center text-gray-400 text-sm">- OR -</div>' +
      '<input type="text" data-oninput="code" value="' + esc(s.code) + '" class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-purple-500 font-mono uppercase" placeholder="預約代碼" />' +
      '<p class="text-xs text-gray-400 -mt-2">預約代碼不分大小寫</p></div>' +
      '<button type="submit" ' + (s.loading ? 'disabled' : '') + ' class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md flex justify-center items-center gap-2">' +
      (s.loading ? '查詢中...' : '查詢預約') + '</button></form>' +

      (s.error ? '<div class="bg-red-50 text-red-700 p-4 rounded-xl text-sm flex items-center gap-2 mb-6"><i data-lucide="alert-circle" class="h-5 w-5 shrink-0"></i>' + esc(s.error) + '</div>' : '') +

      '<div class="space-y-4">' + s.results.map(mb.renderBookingCard).join('') + '</div>' +
      '</div></div>'
    refreshIcons()
  },

  renderBookingCard: function (booking) {
    var s = mb.state
    if (s.editingId === booking.id) return mb.renderEditCard(booking)
    return '' +
      '<div class="bg-white border rounded-xl p-5 shadow-sm transition-all hover:shadow-md relative overflow-hidden ' +
      (booking.status === 'completed' ? 'border-l-8 border-l-gray-400' : 'border-l-8 border-l-green-500') + '">' +
      '<div class="flex justify-between items-start mb-4"><div><h3 class="font-bold text-lg text-gray-800">' + esc(booking.supplierName) + '</h3>' +
      '<p class="text-xs text-purple-600 font-mono mt-1 font-bold bg-purple-50 px-2 py-0.5 rounded inline-block">CODE: ' + esc(booking.bookingCode) + '</p></div>' +
      '<div class="text-xs font-bold px-3 py-1 rounded-full ' + (booking.status === 'completed' ? 'bg-gray-100 text-gray-600' : 'bg-green-100 text-green-700') + '">' +
      (booking.status === 'completed' ? '已交貨' : '預約有效') + '</div></div>' +
      '<div class="grid grid-cols-2 gap-y-3 gap-x-4 text-sm mb-6">' +
      '<div class="flex items-center gap-2 text-gray-700"><i data-lucide="calendar" class="h-4 w-4 text-gray-400"></i><span>' + esc(displayDate(booking.date)) + '</span></div>' +
      '<div class="flex items-center gap-2 text-gray-700"><i data-lucide="clock" class="h-4 w-4 text-gray-400"></i><span>' + esc(booking.time) + '</span></div>' +
      '<div class="flex items-center gap-2 text-gray-700 col-span-2"><i data-lucide="map-pin" class="h-4 w-4 text-gray-400"></i><span class="truncate">' + esc(booking.location || '未指定') + '</span></div>' +
      (booking.needForklift ? '<div class="flex items-center gap-2 text-gray-700 col-span-2"><i data-lucide="forklift" class="h-4 w-4 text-gray-400"></i><span>堆高機需求: ' + (booking.needForklift === 'yes' ? '是' : '否') + '</span></div>' : '') +
      '</div>' +
      (booking.status !== 'completed' ? '' +
        '<div class="flex gap-2">' +
        '<button data-action="start-edit" data-id="' + booking.id + '" class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-600 font-bold py-2.5 px-4 rounded-lg transition duration-200 border border-amber-200 flex justify-center items-center gap-2"><i data-lucide="pencil" class="h-4 w-4"></i> 修改</button>' +
        '<button data-action="cancel-booking" data-id="' + booking.id + '" ' + (s.cancellingId === booking.id ? 'disabled' : '') + ' class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2.5 px-4 rounded-lg transition duration-200 border border-red-200 flex justify-center items-center gap-2">' +
        (s.cancellingId === booking.id ? '處理中...' : '<i data-lucide="x" class="h-4 w-4"></i> 取消') + '</button></div>' : '') +
      '</div>'
  },

  renderEditCard: function (booking) {
    var s = mb.state
    var ef = s.editForm
    var result = mb.editAvailability(booking)
    var isParcel = ef.locations.indexOf(PARCEL_LOCATION) >= 0
    return '' +
      '<div class="bg-white border-2 border-amber-400 rounded-xl p-5 shadow-lg relative animate-fade-in">' +
      '<h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="pencil" class="h-5 w-5 text-amber-500"></i> 修改預約</h3>' +
      '<div class="space-y-4">' +
      '<div><label class="block text-xs font-bold text-gray-500 mb-1">預約日期</label>' +
      '<input type="date" min="' + GLOBAL.config.minDate + '" max="' + GLOBAL.config.maxDate + '" data-onchange="edit-date" value="' + ef.date + '" class="w-full p-2 border rounded-lg text-sm" /></div>' +
      '<div><label class="block text-xs font-bold text-gray-500 mb-1">預約時段</label>' +
      '<select data-onchange="edit-time" ' + (result.dayBlocked ? 'disabled' : '') + ' class="w-full p-2 border rounded-lg text-sm">' +
      '<option value="">請選擇</option>' +
      TIME_SLOTS.filter(function (slot) { return isParcel ? slot === PARCEL_ONLY_SLOT : slot !== PARCEL_ONLY_SLOT }).map(function (slot) {
        var a = result.availability[slot]
        if (!a) return ''
        return '<option value="' + slot + '" ' + (!a.available ? 'disabled' : '') + ' ' + (ef.time === slot ? 'selected' : '') + '>' + slot + ' ' + (!a.available ? '(' + (a.reason || '不可用') + ')' : '(餘' + a.remaining + ')') + '</option>'
      }).join('') +
      '</select></div>' +
      '<div><label class="block text-xs font-bold text-gray-500 mb-1">交貨地點</label><div class="flex flex-wrap gap-2">' +
      LOCATIONS.map(function (loc) {
        var sel = ef.locations.indexOf(loc.name) >= 0
        return '<button type="button" data-action="toggle-edit-location" data-name="' + esc(loc.name) + '" class="px-3 py-1 text-xs border rounded-full transition ' + (sel ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 hover:bg-gray-50') + '">' + esc(loc.name) + '</button>'
      }).join('') + '</div></div>' +
      '<div><label class="block text-xs font-bold text-gray-500 mb-1">堆高機需求</label><div class="flex gap-4">' +
      '<label class="flex items-center gap-1 text-sm"><input type="radio" name="editForklift" value="yes" data-onchange="edit-forklift" ' + (ef.needForklift === 'yes' ? 'checked' : '') + ' ' + (isParcel ? 'disabled' : '') + ' /> 需要</label>' +
      '<label class="flex items-center gap-1 text-sm"><input type="radio" name="editForklift" value="no" data-onchange="edit-forklift" ' + (ef.needForklift === 'no' ? 'checked' : '') + ' ' + (isParcel ? 'disabled' : '') + ' /> 不需要</label>' +
      '</div></div></div>' +
      '<div class="flex gap-2 mt-6 border-t pt-4">' +
      '<button data-action="save-edit" data-id="' + booking.id + '" ' + (s.saving ? 'disabled' : '') + ' class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-lg text-sm">' + (s.saving ? '儲存中...' : '確認儲存') + '</button>' +
      '<button data-action="cancel-edit" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-2 px-4 rounded-lg text-sm">取消</button>' +
      '</div></div>'
  },

  fetchEditSlotCounts: function () {
    var date = mb.state.editForm.date
    if (!date) return
    api('slotCounts', { date: date }).then(function (data) {
      if (mb.state.editForm.date !== date) return
      mb.state.slotCounts = data.slots || {}
      mb.render()
    }).catch(function () {})
  },

  onSubmit: function (action) {
    if (action !== 'search') return
    var s = mb.state
    s.error = ''; s.results = []; s.editingId = null
    if (!s.email && !s.code) { s.error = '請輸入 Email 或預約代碼其中一項進行查詢'; mb.render(); return }
    s.loading = true
    mb.render()
    var p = s.code ? api('lookupByCode', { code: s.code }).then(function (d) { return d.booking ? [d.booking] : [] }) : api('lookupByEmail', { email: s.email }).then(function (d) { return d.bookings || [] })
    p.then(function (list) {
      var active = list.filter(function (b) { return b.status !== 'cancelled' })
      if (active.length === 0) s.error = s.code ? '找不到符合的預約，請確認預約代碼是否輸入正確（不分大小寫）。' : '找不到符合的預約，請確認 Email 是否與預約時填寫的完全相同。'
      s.results = active
    }).catch(function () { s.error = '查詢錯誤' }).then(function () { s.loading = false; mb.render() })
  },

  onInput: function (action, target) {
    if (action === 'email') mb.state.email = target.value
    else if (action === 'code') mb.state.code = target.value
  },

  onChange: function (action, target) {
    var ef = mb.state.editForm
    if (action === 'edit-date') { ef.date = target.value; mb.fetchEditSlotCounts(); mb.render(); return }
    if (action === 'edit-time') { ef.time = target.value; mb.render(); return }
    if (action === 'edit-forklift') { ef.needForklift = target.value; return }
  },

  onClick: function (action, target) {
    var s = mb.state
    if (action === 'start-edit') {
      var id = target.getAttribute('data-id')
      var booking = s.results.filter(function (b) { return b.id === id })[0]
      if (!booking) return
      var lock = cutoffHint(booking.date, booking.time)
      if (lock.locked) { alert('無法修改：' + lock.reason); return }
      s.editingId = booking.id
      s.editForm = { date: booking.date, time: booking.time, locations: (booking.locations || (booking.location ? [booking.location] : [])).slice(), needForklift: booking.needForklift || 'no' }
      mb.render()
      mb.fetchEditSlotCounts()
      return
    }
    if (action === 'cancel-edit') { s.editingId = null; s.editForm = {}; mb.render(); return }
    if (action === 'toggle-edit-location') {
      var name = target.getAttribute('data-name')
      var locs = s.editForm.locations.slice()
      if (locs.indexOf(name) >= 0) locs = locs.filter(function (l) { return l !== name })
      else locs.push(name)
      s.editForm.locations = locs
      mb.render()
      return
    }
    if (action === 'save-edit') {
      var bookingId = target.getAttribute('data-id')
      var booking2 = s.results.filter(function (b) { return b.id === bookingId })[0]
      if (!booking2) return
      var result = mb.editAvailability(booking2)
      if (result.dayBlocked) { alert('所選日期暫停預約或已過時限'); return }
      var slot = result.availability[s.editForm.time]
      if (!slot || !slot.available) { alert('所選時段不可用'); return }
      var lock2 = cutoffHint(s.editForm.date, s.editForm.time)
      if (lock2.locked) { alert(lock2.reason); return }
      s.saving = true
      mb.render()
      api('moveBooking', { code: booking2.bookingCode, date: s.editForm.date, time: s.editForm.time, locations: s.editForm.locations, needForklift: s.editForm.needForklift })
        .then(function () {
          s.results = s.results.map(function (b) {
            if (b.id !== booking2.id) return b
            return Object.assign({}, b, { date: s.editForm.date, time: s.editForm.time, locations: s.editForm.locations, location: s.editForm.locations.join(', '), needForklift: s.editForm.needForklift })
          })
          s.editingId = null
          s.saving = false
          mb.render()
        })
        .catch(function (err) { s.saving = false; alert(err.message === 'SLOT_FULL' ? '所選時段剛好額滿，請重新選擇' : (err.message || '儲存失敗')); mb.render() })
      return
    }
    if (action === 'cancel-booking') {
      var cid = target.getAttribute('data-id')
      var b3 = s.results.filter(function (b) { return b.id === cid })[0]
      if (!b3) return
      if (!window.confirm('確定取消 ' + displayDate(b3.date) + ' 的預約？')) return
      s.cancellingId = cid
      mb.render()
      api('cancelBooking', { code: b3.bookingCode })
        .then(function () { s.results = s.results.filter(function (b) { return b.id !== cid }); s.cancellingId = null; mb.render() })
        .catch(function () { alert('取消失敗'); s.cancellingId = null; mb.render() })
      return
    }
  },
}

/* ============================================================
 * Toast 通知（給後台用，對應原本 NotificationToast.jsx）
 * ============================================================ */
var toast = {
  items: [],
  history: [],
  push: function (n) {
    var id = Date.now() + '-' + Math.random()
    var entry = Object.assign({ id: id, at: new Date() }, n)
    toast.items.push(entry)
    toast.history.unshift(entry)
    toast.history = toast.history.slice(0, 20)
    toast.render()
    setTimeout(function () { toast.remove(id) }, 5000)
  },
  remove: function (id) {
    toast.items = toast.items.filter(function (x) { return x.id !== id })
    toast.render()
  },
  render: function () {
    var host = qs('#toast-host')
    if (!host) return
    host.innerHTML = toast.items.map(function (n) {
      return '' +
        '<div class="pointer-events-auto flex items-start gap-3 p-4 rounded-lg shadow-lg border-l-4 bg-white animate-slide-in ' + (n.type === 'success' ? 'border-green-500' : 'border-red-500') + '">' +
        '<div class="mt-0.5 ' + (n.type === 'success' ? 'text-green-500' : 'text-red-500') + '">' +
        '<i data-lucide="' + (n.type === 'success' ? 'check-circle-2' : 'x-circle') + '" class="h-5 w-5"></i></div>' +
        '<div class="flex-1 ' + (n.bookingId ? 'cursor-pointer' : '') + '" data-action="toast-jump" data-id="' + esc(n.bookingId || '') + '">' +
        '<h4 class="font-bold text-gray-800 text-sm">' + esc(n.title) + '</h4>' +
        '<p class="text-gray-600 text-xs mt-1">' + esc(n.message) + '</p></div>' +
        '<button class="text-gray-400 hover:text-gray-600" data-action="toast-close" data-id="' + n.id + '"><i data-lucide="x" class="h-4 w-4"></i></button>' +
        '</div>'
    }).join('')
    refreshIcons()
  },
}

/* 全域點擊委派：所有分頁共用同一組 data-action 派送機制 */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-action]')
  if (!t) return
  var action = t.getAttribute('data-action')
  // Modal 遮罩（backdrop）點擊關閉：只有「真的點在遮罩本身」（e.target === t，
  // 而不是點到裡面的按鈕/文字後透過 closest() 往上找到遮罩）才視為關閉，
  // 這樣才不會擋住遮罩裡面按鈕自己的 data-action 派送。
  if (/-backdrop$/.test(action) && e.target !== t) return
  if (action === 'set-tab') { setActiveTab(t.getAttribute('data-tab')); return }
  if (action === 'toast-close') { toast.remove(t.getAttribute('data-id')); return }
  if (action === 'toast-jump') { var bid = t.getAttribute('data-id'); if (bid) ap.jumpToBooking(bid); return }
  if (t.closest('#page-content')) {
    if (appState.activeTab === 'book' && bf.onClick) bf.onClick(action, t, e)
    else if (appState.activeTab === 'manage' && mb.onClick) mb.onClick(action, t, e)
    else if (appState.activeTab === 'schedule' && ap.onClick) ap.onClick(action, t, e)
  }
})
document.addEventListener('change', function (e) {
  var t = e.target.closest('[data-onchange]')
  if (!t || !t.closest('#page-content')) return
  var action = t.getAttribute('data-onchange')
  if (appState.activeTab === 'book' && bf.onChange) bf.onChange(action, t, e)
  else if (appState.activeTab === 'manage' && mb.onChange) mb.onChange(action, t, e)
  else if (appState.activeTab === 'schedule' && ap.onChange) ap.onChange(action, t, e)
})
document.addEventListener('input', function (e) {
  var t = e.target.closest('[data-oninput]')
  if (!t || !t.closest('#page-content')) return
  var action = t.getAttribute('data-oninput')
  if (appState.activeTab === 'book' && bf.onInput) bf.onInput(action, t, e)
  else if (appState.activeTab === 'manage' && mb.onInput) mb.onInput(action, t, e)
  else if (appState.activeTab === 'schedule' && ap.onInput) ap.onInput(action, t, e)
})
document.addEventListener('submit', function (e) {
  var form = e.target.closest('form[data-onsubmit]')
  if (!form || !form.closest('#page-content')) return
  e.preventDefault()
  var action = form.getAttribute('data-onsubmit')
  if (appState.activeTab === 'book' && bf.onSubmit) bf.onSubmit(action, form, e)
  else if (appState.activeTab === 'manage' && mb.onSubmit) mb.onSubmit(action, form, e)
  else if (appState.activeTab === 'schedule' && ap.onSubmit) ap.onSubmit(action, form, e)
})
document.addEventListener('mousedown', function (e) {
  if (appState.activeTab === 'book' && bf.onOutsideMousedown) bf.onOutsideMousedown(e)
})

      '<div><label class="block text-sm font-bold text-gray-700 mb-2">1. 供應商名稱 <span class="text-red-500">*</span></label>' +
      '<div class="relative" id="supplier-box">' +
      '<input type="text" required autocomplete="off" placeholder="輸入關鍵字以搜尋..." data-oninput="supplier" value="' + esc(f.supplierName) + '" ' +
      'class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />' +
      '<ul id="supplier-suggestions" class="absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-xl shadow-lg max-h-60 overflow-y-auto hidden"></ul>' +
      '</div></div>' +

      '<div><label class="block text-sm font-bold text-gray-700 mb-2">Email 電子信箱 <span class="text-xs text-gray-400 font-normal">(僅查詢預約用)</span> <span class="text-red-500">*</span></label>' +
      '<div class="relative"><i data-lucide="mail" class="absolute left-3 top-3.5 h-5 w-5 text-gray-400"></i>' +
      '<input type="email" required placeholder="name@company.com" data-oninput="email" value="' + esc(f.email) + '" ' +
      'class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" /></div></div>' +
      '</div>' +

      '<div><label class="block text-sm font-bold text-gray-700 mb-3 flex justify-between"><span>2. 選擇交貨地點 <span class="text-red-500">*</span></span>' +

      '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">' + locCards + '</div>' +
      (bf.state.locationNotice ? '<p class="mt-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 animate-fade-in">' + esc(bf.state.locationNotice) + '</p>' : '') +
      '</div>' +

      '<div class="bg-slate-50 p-4 rounded-xl border border-slate-200 ' + (parcelSelected ? 'opacity-50' : '') + '">' +
      '<label class="block text-sm font-bold text-gray-700 mb-3 flex items-center gap-2">' +
      '<span class="bg-slate-200 w-5 h-5 rounded-full flex items-center justify-center text-xs text-slate-600 font-bold">3</span> 是否需堆高機？ <span class="text-red-500">*</span>' +
      (parcelSelected ? '<span class="text-xs font-normal text-gray-500">(包裹類預設不需要)</span>' : '') + '</label>' +
      '<div class="flex gap-6">' +
      [{ v: 'yes', l: '是，需要堆高機' }, { v: 'no', l: '否，不需堆高機' }].map(function (opt) {
        return '<label class="flex items-center gap-2 cursor-pointer group ' + (parcelSelected ? 'cursor-not-allowed' : '') + '">' +
          '<input type="radio" name="forklift" value="' + opt.v + '" data-onchange="forklift" ' + (parcelSelected ? 'disabled' : '') + ' ' + (f.needForklift === opt.v ? 'checked' : '') + ' class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-gray-300 cursor-pointer disabled:cursor-not-allowed" />' +
          '<span class="group-hover:text-blue-600 transition-colors ' + (parcelSelected ? 'text-gray-400 group-hover:text-gray-400' : '') + '">' + opt.l + '</span></label>'
      }).join('') + '</div></div>' +

      '<div class="grid grid-cols-1 md:grid-cols-2 gap-6">' +
      '<div><label class="block text-sm font-bold text-gray-700 mb-2">4. 預約日期 <span class="text-red-500">*</span></label>' +
      '<div class="relative"><i data-lucide="calendar" class="absolute left-3 top-3 h-5 w-5 text-gray-400"></i>' +
      '<input type="date" required lang="en" min="' + GLOBAL.config.minDate + '" max="' + GLOBAL.config.maxDate + '" data-onchange="date" value="' + f.date + '" ' +
      'class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white" /></div>' +
      '<div id="date-messages"></div></div>' +

      '<div><label class="block text-sm font-bold text-gray-700 mb-2">5. 預約時段 <span class="text-red-500">*</span></label>' +
      '<div class="relative" id="time-select-box"></div></div>' +
      '</div>' +

      (parcelSelected ? '<div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-900 animate-fade-in flex gap-3">' +
        '<i data-lucide="package-x" class="h-5 w-5 text-amber-600 shrink-0 mt-0.5"></i><div><h4 class="font-bold mb-1">包裹/貨運 注意事項</h4>' +
        '<p>交貨日期請填寫<strong>「貨運到達日期」</strong>，<span class="text-red-600 font-bold">而非</span>寄貨當日日期。</p>' +
        '<p class="text-xs text-amber-700 mt-1">若因日期填寫錯誤導致未到貨，將視同未預約。</p></div></div>' : '') +

      '<div class="pt-4">' +
      '<div class="flex items-center gap-3 mb-4 p-3 bg-blue-50 rounded-lg border border-blue-100">' +
      '<input id="agreement" type="checkbox" required data-onchange="agree" ' + (f.agreedToRules ? 'checked' : '') + ' class="w-5 h-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500 cursor-pointer" />' +
      '<label for="agreement" class="text-sm font-medium text-gray-700 cursor-pointer select-none">我已詳細閱讀並同意上述所有預約規定</label></div>' +
      '<button type="submit" ' + (bf.state.submitting ? 'disabled' : '') + ' class="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 px-6 rounded-xl transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg flex justify-center items-center gap-2 text-lg">' +
      (bf.state.submitting ? '系統處理中...' : '確認送出預約 <i data-lucide="send" class="h-5 w-5"></i>') +
      '</button></div>' +
      '</form></div></div>'
  },

  // 只重繪「時段選單 + 日期訊息」，避免整表重繪打斷使用者在其他欄位的輸入
  renderAvailability: function () {
    var box = qs('#time-select-box')
    var msgBox = qs('#date-messages')
    if (!box) return
    var f = bf.state.form
    var parcelSelected = f.locations.indexOf(PARCEL_LOCATION) >= 0
    var visibleSlots = TIME_SLOTS.filter(function (slot) { return parcelSelected ? slot === PARCEL_ONLY_SLOT : slot !== PARCEL_ONLY_SLOT })
    var result = bf.currentAvailability()
    var disabledSelect = !f.date || f.locations.length === 0 || parcelSelected || result.dayBlocked
    var placeholder = !f.date ? '請先選擇預約日期' : (f.locations.length === 0 ? '請先選擇交貨地點' : (result.dayBlocked ? (result.messages[0] || '此日期暫停預約') : (parcelSelected ? '已自動鎖定包裹專用時段' : '請選擇時段')))

    box.innerHTML = '' +
      '<i data-lucide="clock" class="absolute left-3 top-3 h-5 w-5 text-gray-400 z-10"></i>' +
      '<select ' + (disabledSelect ? 'disabled' : '') + ' data-onchange="time" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition appearance-none ' +
      (disabledSelect ? 'bg-gray-100 text-gray-500 cursor-not-allowed' : 'bg-white') + '">' +
      '<option value="">' + placeholder + '</option>' +
      visibleSlots.map(function (slot) {
        var a = result.availability[slot]
        if (!a) return ''
        var label = slot + ((!a.available || parcelSelected) ? '' : ' (餘 ' + a.remaining + ')')
        return '<option value="' + slot + '" ' + (!a.available ? 'disabled' : '') + ' ' + (f.time === slot ? 'selected' : '') + '>' + label + '</option>'
      }).join('') +
      '</select><i data-lucide="chevron-down" class="absolute right-3 top-3.5 h-4 w-4 text-gray-500 pointer-events-none"></i>'

    if (msgBox) {
      msgBox.innerHTML = result.messages.length ? '' +
        '<div class="mt-2 text-sm text-red-600 bg-red-50 p-3 rounded-lg border border-red-100 space-y-1 animate-fade-in">' +
        result.messages.map(function (m) { return '<div class="flex items-start gap-2"><i data-lucide="alert-triangle" class="h-4 w-4 shrink-0 mt-0.5"></i><span>' + esc(m) + '</span></div>' }).join('') +
        '</div>' : ''
    }
    refreshIcons()
  },

  updateSuggestions: function () {
    var val = bf.state.form.supplierName
    var box = qs('#supplier-suggestions')
    if (!box) return
    if (!val) { box.classList.add('hidden'); box.innerHTML = ''; return }
    var list = GLOBAL.suppliers.filter(function (s) {
      return (s.name && s.name.toLowerCase().indexOf(val.toLowerCase()) >= 0) || (s.masterId && s.masterId.indexOf(val) >= 0)
    }).slice(0, 10)
    if (list.length === 0) { box.classList.add('hidden'); box.innerHTML = ''; return }
    box.classList.remove('hidden')
    box.innerHTML = list.map(function (s) {
      return '<li data-action="pick-supplier" data-name="' + esc(s.name || '') + '" class="px-4 py-2 hover:bg-blue-50 cursor-pointer text-sm text-gray-700 border-b border-gray-50 last:border-0 flex justify-between">' +
        '<span>' + esc(s.name) + '</span>' + (s.masterId ? '<span class="text-gray-400 text-xs">' + esc(s.masterId) + '</span>' : '') + '</li>'
    }).join('')
  },

  toggleLocation: function (name) {
    var f = bf.state.form
    var locations = f.locations.slice()
    var time = f.time, needForklift = f.needForklift, notice = ''
    if (name === PARCEL_LOCATION) {
      if (locations.indexOf(PARCEL_LOCATION) >= 0) {
        locations = locations.filter(function (l) { return l !== PARCEL_LOCATION })
        if (time === PARCEL_ONLY_SLOT) time = ''
      } else {
        if (locations.length > 0) notice = '已自動取消原本選擇的地點（' + locations.join('、') + '），包裹類只能單選'
        locations = [PARCEL_LOCATION]
        time = PARCEL_ONLY_SLOT
        needForklift = 'no'
      }
    } else if (locations.indexOf(PARCEL_LOCATION) >= 0) {
      notice = '已自動取消包裹類，改為您剛選擇的地點'
      locations = [name]
      if (time === PARCEL_ONLY_SLOT) time = ''
    } else if (locations.indexOf(name) >= 0) {
      locations = locations.filter(function (l) { return l !== name })
    } else {
      locations.push(name)
    }
    f.locations = locations; f.time = time; f.needForklift = needForklift
    bf.state.locationNotice = notice
    bf.render()
    bf.refreshSlotCounts()
    if (notice) setTimeout(function () { bf.state.locationNotice = ''; var n = qs('.animate-fade-in'); bf.render() }, 4000)
  },

  onClick: function (action, target) {
    if (action === 'toggle-location') { bf.toggleLocation(target.getAttribute('data-name')); return }
    if (action === 'pick-supplier') { bf.state.form.supplierName = target.getAttribute('data-name'); qs('#supplier-suggestions').classList.add('hidden'); qs('input[data-oninput="supplier"]').value = bf.state.form.supplierName; return }
    if (action === 'reset') { bf.resetForm(); bf.render(); bf.refreshSlotCounts(); return }
  },

  onChange: function (action, target) {
    var f = bf.state.form
    if (action === 'date') { f.date = target.value; f.time = ''; bf.render(); bf.refreshSlotCounts(); return }
    if (action === 'time') { f.time = target.value; return }
    if (action === 'forklift') { f.needForklift = target.value; return }
    if (action === 'agree') { f.agreedToRules = target.checked; return }
  },

  onInput: function (action, target) {
    if (action === 'supplier') { bf.state.form.supplierName = target.value; bf.updateSuggestions(); return }
    if (action === 'email') { bf.state.form.email = target.value; return }
  },

  onOutsideMousedown: function (e) {
    var box = qs('#supplier-box')
    if (box && !box.contains(e.target)) { var sug = qs('#supplier-suggestions'); if (sug) sug.classList.add('hidden') }
  },

  onSubmit: function (action) {
    if (action !== 'book') return
    var f = bf.state.form
    bf.state.error = ''
    var problems = []
    if (f.locations.length === 0) problems.push('請選擇交貨地點')
    if (!f.time) problems.push('請選擇時段')
    var avail = bf.currentAvailability()
    if (f.time && !(avail.availability[f.time] && avail.availability[f.time].available)) problems.push('所選時段已額滿或暫停預約')
    var lock = cutoffHint(f.date, f.time)
    if (lock.locked) problems.push(lock.reason)
    if (!f.agreedToRules) problems.push('請勾選同意預約規定')
    if (problems.length > 0) { bf.state.error = problems.join('；'); bf.render(); return }

    bf.state.submitting = true
    bf.render()
    api('createBooking', { supplierName: f.supplierName, email: f.email, locations: f.locations, date: f.date, time: f.time, needForklift: f.needForklift })
      .then(function (data) {
        bf.state.submitting = false
        bf.state.bookingCode = data.bookingCode
        bf.render()
      })
      .catch(function (err) {
        bf.state.submitting = false
        bf.state.error = err.message === 'SLOT_FULL' ? '所選時段已在您送出的同時額滿，請重新選擇時段' : (err.message || '預約失敗，請重試')
        bf.render()
        bf.refreshSlotCounts()
      })
  },
}

function pastDaysStr(days) { var d = new Date(); d.setDate(d.getDate() - days); return formatDateObj(d) }

var ap = {
  host: null,
  pollTimer: null,
  state: {
    token: null, password: '', loginError: '', loggingIn: false,
    view: 'list', rangePreset: 'today', range: { start: todayStr(), end: todayStr() },
    search: '', bookings: [], loadingList: false, exporting: false, updatingId: null,
    showPasswordModal: false, newPassword: '', confirmPassword: '', changingPassword: false,
    showHistory: false, highlightId: null, showCancelled: false, firstLoad: true,
    showNoonModal: false, noonLoading: false, noonBookings: [], noonShowAll: false, noonExporting: false,
  },

  // 早上出單時間（07:45）之後才新增/異動、且預約「今天下午」時段的預約，就是中午出單時需要補列的廠商
  NOON_CUTOFF: { h: 7, m: 45 },
  noonCutoffDate: function () { var d = new Date(); d.setHours(ap.NOON_CUTOFF.h, ap.NOON_CUTOFF.m, 0, 0); return d },
  classifyNoon: function (b) {
    // 回傳 'new'（07:45 後新增）、'moved'（07:45 前就存在，但 07:45 後被改到今天下午）或 ''（早上出單時就已經在名單上）
    var cutoff = ap.noonCutoffDate()
    var created = b.createdAt ? new Date(b.createdAt) : null
    var updated = b.updatedAt ? new Date(b.updatedAt) : null
    if (created && !isNaN(created) && created >= cutoff) return 'new'
    if (updated && !isNaN(updated) && updated >= cutoff) return 'moved'
    return ''
  },
  noonList: function () {
    var today = todayStr()
    return ap.state.noonBookings
      .filter(function (b) { return b.date === today && b.status === 'active' && String(b.time).indexOf('下午') >= 0 })
      .map(function (b) { return Object.assign({}, b, { noonKind: ap.classifyNoon(b) }) })
      .filter(function (b) { return ap.state.noonShowAll || b.noonKind })
      .sort(function (a, b) { return a.time < b.time ? -1 : a.time > b.time ? 1 : (a.createdAt || '') < (b.createdAt || '') ? -1 : 1 })
  },

  mount: function (host) {
    ap.host = host
    ap.state.token = localStorage.getItem('ycm_admin_token') || null
    if (ap.pollTimer) clearInterval(ap.pollTimer)
    if (ap.state.token) {
      ap.state.view = 'list'
      ap.render()
      ap.loadBookings()
      ap.pollTimer = setInterval(function () { if (appState.activeTab === 'schedule' && ap.state.view === 'list') ap.loadBookings() }, 600000)
    } else {
      ap.render()
    }
  },

  forceLogout: function (message) {
    localStorage.removeItem('ycm_admin_token')
    ap.state.token = null
    ap.state.password = ''
    ap.state.loginError = message || ''
    if (ap.pollTimer) clearInterval(ap.pollTimer)
    ap.render()
  },

  isAuthErr: function (err) { return err && (err.message === 'UNAUTHORIZED' || err.message === 'SESSION_EXPIRED') },

  render: function () {
    if (!ap.host) return
    if (!ap.state.token) { ap.host.innerHTML = ap.renderLogin(); refreshIcons(); return }
    ap.host.innerHTML = ap.renderDashboardShell()
    refreshIcons()
    var sub = qs('#admin-subview')
    if (ap.state.view === 'rules') rm.mount(sub)
    else if (ap.state.view === 'suppliers') sm.mount(sub)
    else if (ap.state.view === 'announcements') an.mount(sub)
    else ap.renderListView(sub)
  },

  renderLogin: function () {
    var s = ap.state
    return '' +
      '<div class="max-w-md mx-auto mt-12 p-8 bg-white rounded-2xl shadow-xl border border-slate-100 animate-fade-in">' +
      '<div class="text-center mb-8"><div class="bg-slate-900 p-4 rounded-full inline-block mb-4 shadow-lg"><i data-lucide="shield-check" class="h-8 w-8 text-white"></i></div>' +
      '<h2 class="text-2xl font-extrabold text-gray-800">管理員登入</h2><p class="text-sm text-gray-500 mt-2">請輸入收貨站管理密碼</p></div>' +
      '<form data-onsubmit="admin-login" class="space-y-4">' +
      '<input type="password" required autofocus data-oninput="admin-password" value="' + esc(s.password) + '" placeholder="••••••••" class="w-full px-4 py-4 border border-gray-300 rounded-xl text-center text-lg tracking-widest focus:ring-2 focus:ring-slate-500 outline-none" />' +
      (s.loginError ? '<div class="bg-red-50 text-red-500 text-sm p-3 rounded-lg text-center">' + esc(s.loginError) + '</div>' : '') +
      '<button type="submit" ' + (s.loggingIn ? 'disabled' : '') + ' class="w-full bg-slate-900 hover:bg-black disabled:opacity-50 text-white font-bold py-4 rounded-xl flex justify-center items-center gap-2">' +
      '<i data-lucide="log-in" class="h-5 w-5"></i> ' + (s.loggingIn ? '驗證中...' : '進入後台') + '</button>' +
      '</form></div>'
  },

  renderDashboardShell: function () {

    return '' +

      '<div><h2 class="text-2xl font-extrabold text-gray-800 flex items-center gap-3">收貨站排程管理 <span class="text-xs bg-orange-100 text-orange-700 px-2 py-1 rounded-full font-bold">ADMIN</span></h2>' +
      (s.view === 'list' ? '<p class="text-sm text-gray-500 mt-1 font-medium">' + esc(rangeLabel) + '</p>' : '') + '</div>' +
      '<div class="flex flex-wrap gap-3 w-full xl:w-auto items-center">' +
      '<div class="flex bg-slate-100 p-1.5 rounded-xl overflow-x-auto">' +

        var parts = pair.split(':'); var v = parts[0], label = parts[1]
        return '<button data-action="set-view" data-view="' + v + '" class="px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap transition-all ' + (s.view === v ? 'bg-white shadow text-blue-600' : 'text-slate-500 hover:text-slate-700') + '">' + label + '</button>'
      }).join('') +
      '</div>' +

      (toast.history.length > 0 ? '<span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center">' + (toast.history.length > 9 ? '9+' : toast.history.length) + '</span>' : '') +
      '</button>' +
      (s.showHistory ? '' +
        '<div class="fixed inset-0 z-40" data-action="toggle-history"></div>' +
        '<div class="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-2xl border border-gray-200 z-50 max-h-96 overflow-y-auto">' +
        '<div class="px-4 py-3 border-b border-gray-100 font-bold text-sm text-gray-700">最近通知</div>' +
        (toast.history.length === 0 ? '<p class="px-4 py-6 text-sm text-gray-400 text-center">目前沒有通知紀錄</p>' :
          toast.history.map(function (n) {
            return '<button data-action="jump-booking" data-id="' + esc(n.bookingId || '') + '" class="w-full text-left px-4 py-3 border-b border-gray-50 last:border-0 hover:bg-slate-50 transition">' +
              '<p class="text-sm font-bold text-gray-800">' + esc(n.title) + '</p><p class="text-xs text-gray-500 mt-0.5">' + esc(n.message) + '</p>' +
              '<p class="text-[10px] text-gray-400 mt-1">' + n.at.toLocaleTimeString() + '</p></button>'
          }).join('')) +
        '</div>' : '') +
      '</div>' +
      '<button data-action="open-password-modal" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-xl transition font-medium border border-gray-200 bg-white whitespace-nowrap">修改密碼</button>' +
      '<button data-action="logout" class="px-4 py-2 text-sm text-white bg-red-500 hover:bg-red-600 rounded-xl transition font-medium shadow-sm whitespace-nowrap">登出</button>' +
      '</div></div>' +

      (s.showPasswordModal ? ap.renderPasswordModal() : '') +
      (s.showNoonModal ? ap.renderNoonModal() : '') +

      '<div id="admin-subview"></div>' +
      '</div>'
  },

  renderPasswordModal: function () {
    var s = ap.state
    return '' +

      if (k === 'moved') return '<span class="text-[10px] font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded border border-amber-200">改期/改時段</span>'

    }
    var fmtTime = function (iso) { if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? '' : String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') }

      '<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" data-action="close-noon-backdrop">' +

      '<div class="flex justify-between items-start p-6 border-b border-gray-100 no-print">' +
      '<div><h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="sun" class="h-5 w-5 text-amber-500"></i> 中午新增預約（今日下午時段）</h3>' +

      '<div class="ml-auto flex gap-2">' +

      '<button data-action="noon-print" ' + (list.length === 0 ? 'disabled' : '') + ' class="flex items-center gap-1 px-3 py-2 text-sm font-bold text-white bg-slate-800 rounded-lg hover:bg-black disabled:opacity-40"><i data-lucide="printer" class="h-4 w-4"></i> 列印</button>' +

      '</div></div>' +

      '<div id="noon-print" class="p-6 overflow-y-auto">' +
      '<div class="mb-3"><div class="text-base font-bold text-gray-800">' + (s.noonShowAll ? '今日下午全部預約' : '中午新增預約清單') + ' — ' + esc(displayDate(todayStr())) + '</div>' +
      '<div class="text-xs text-gray-500">產出時間：' + esc(stamp) + '　共 ' + list.length + ' 筆' + (s.noonShowAll ? '' : '（' + cutoffLabel + ' 之後新增/異動）') + '</div></div>' +
      (s.noonLoading && ap.state.noonBookings.length === 0 ? '<div class="text-center py-12 text-gray-400">資料載入中...</div>' :
        list.length === 0 ? '<div class="text-center py-12 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200 text-gray-500 font-medium">' + (s.noonShowAll ? '今天下午沒有任何有效預約' : cutoffLabel + ' 之後沒有新增或改到今天下午的預約') + '</div>' :
          '<div class="overflow-x-auto rounded-xl border border-gray-200"><table class="min-w-full divide-y divide-gray-200 text-sm">' +
          '<thead class="bg-gray-50"><tr>' + ['時段', '供應商', '交貨地點', '預約代碼', '堆高機', '預約時間', '類型'].map(function (h) { return '<th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">' + h + '</th>' }).join('') + '</tr></thead>' +
          '<tbody class="bg-white divide-y divide-gray-100">' +

              '<td class="px-4 py-3 whitespace-nowrap text-gray-500">' + esc(fmtTime(b.noonKind === 'moved' ? b.updatedAt : b.createdAt)) + '</td>' +

              '</tr>'
          }).join('') + '</tbody></table></div>') +
      '</div></div></div>'
  },

  loadNoonBookings: function () {
    var s = ap.state
    s.noonLoading = true
    ap.render()
    var today = todayStr()
    api('listBookings', { token: s.token, start: today, end: today }).then(function (data) {
      s.noonBookings = data.bookings || []
      s.noonLoading = false
      ap.render()
    }).catch(function (err) {
      s.noonLoading = false
      if (ap.isAuthErr(err)) { ap.forceLogout('登入已逾期，請重新登入'); return }
      alert('讀取今日預約失敗：' + (err.message || ''))
      ap.render()
    })
  },

  exportNoon: function () {
    var list = ap.noonList()
    if (list.length === 0) return
    var s = ap.state
    s.noonExporting = true
    ap.render()
    loadXLSX().then(function (XLSX) {
      var rows = list.map(function (b) {
        var d = new Date(b.noonKind === 'moved' ? b.updatedAt : b.createdAt)
        return {
          日期: displayDate(b.date), 時段: b.time, 供應商: b.supplierName, 交貨地點: b.location || '', 預約代碼: b.bookingCode, Email: b.email,
          堆高機需求: b.needForklift === 'yes' ? '是' : '否',
          類型: b.noonKind === 'new' ? '新增' : (b.noonKind === 'moved' ? '改期/改時段' : '早上已出單'),
          預約時間: isNaN(d) ? '' : (String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0')),
        }
      })
      var ws = XLSX.utils.json_to_sheet(rows)
      var wb = XLSX.utils.book_new()
      XLSX.utils.book_append_sheet(wb, ws, '中午新增預約')
      XLSX.writeFile(wb, '中午新增預約_' + todayStr() + '.xlsx')
      toast.push({ type: 'success', title: '匯出成功', message: '已下載 ' + rows.length + ' 筆中午新增預約' })
      s.noonExporting = false
      ap.render()
    }).catch(function (err) {
      console.error('Export failed:', err)
      alert('匯出 Excel 失敗，請檢查網路連線後重試')
      s.noonExporting = false
      ap.render()
    })
  },

  loadBookings: function () {
    var s = ap.state
    s.loadingList = true
    var sub = qs('#admin-subview')
    if (sub && s.view === 'list') ap.renderListView(sub)
    api('listBookings', { token: s.token, start: s.range.start, end: s.range.end })
      .then(function (data) {
        var list = data.bookings || []
        if (!s.firstLoad) {
          var prevById = {}
          s.bookings.forEach(function (b) { prevById[b.id] = b })
          list.forEach(function (b) {
            var prev = prevById[b.id]
            if (!prev && b.status === 'active') toast.push({ type: 'success', title: '🟢 新增預約通知', message: b.supplierName + ' 預約了 ' + displayDate(b.date) + ' ' + b.time, bookingId: b.id })
            if (prev && prev.status !== 'cancelled' && b.status === 'cancelled') toast.push({ type: 'error', title: '🔴 取消預約通知', message: b.supplierName + ' 取消了 ' + displayDate(b.date) + ' ' + b.time + ' 的預約', bookingId: b.id })
          })
        }
        s.firstLoad = false
        s.bookings = list
        s.loadingList = false
        if (qs('#admin-subview') && s.view === 'list') ap.renderListView(qs('#admin-subview'))
      })
      .catch(function (err) {
        s.loadingList = false
        if (ap.isAuthErr(err)) { ap.forceLogout('登入已逾期，請重新登入'); return }
        if (qs('#admin-subview') && s.view === 'list') ap.renderListView(qs('#admin-subview'))
      })
  },

  filteredBookings: function () {
    var s = ap.state
    return s.bookings.filter(function (b) {
      if (!s.search) return true
      var q = s.search.toLowerCase()
      return (b.supplierName && b.supplierName.toLowerCase().indexOf(q) >= 0) || (b.email && b.email.toLowerCase().indexOf(q) >= 0) || (b.bookingCode && b.bookingCode.toLowerCase().indexOf(q) >= 0)
    })
  },

      ['today:今天', 'future_3:未來 3 天', 'future_7:未來 1 週', 'past_3:過去 3 天', 'past_7:過去 1 週', 'custom_range:自訂日期區間'].map(function (p) {

      (s.rangePreset === 'custom_range' ? '' +
        '<div class="flex items-center gap-2 bg-white px-3 py-2 rounded-xl border border-gray-300 shadow-sm">' +
        '<input type="date" data-onchange="range-start" value="' + esc(s.range.start || '') + '" class="p-1 border-none outline-none text-sm font-medium text-gray-600" />' +
        '<span class="text-gray-400">➜</span>' +
        '<input type="date" data-onchange="range-end" value="' + esc(s.range.end || '') + '" class="p-1 border-none outline-none text-sm font-medium text-gray-600" />' +
        '</div>' : '') +
      '<p class="text-xs text-gray-400 w-full basis-full">此區間僅決定「預約列表」跟「搜尋」顯示的資料範圍，不代表僅有此範圍內有預約</p></div>' +
      '<div class="flex gap-2 flex-wrap justify-end">' +
      '<button data-action="refresh-list" ' + (s.loadingList ? 'disabled' : '') + ' class="flex items-center gap-2 px-4 py-2.5 bg-white hover:bg-gray-50 text-gray-700 text-sm font-bold rounded-xl transition shadow-md border border-gray-300 ' + (s.loadingList ? 'opacity-70 cursor-wait' : '') + '" title="立即重新讀取最新的預約資料">' +
      '<i data-lucide="refresh-cw" class="h-4 w-4' + (s.loadingList ? ' animate-spin' : '') + '"></i> ' + (s.loadingList ? '刷新中...' : '立即刷新') + '</button>' +
      '<button data-action="open-noon" class="flex items-center gap-2 px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold rounded-xl transition shadow-md" title="列出今天早上 07:45 出單後才新增或改到「今天下午」時段的預約">' +
      '<i data-lucide="sun" class="h-4 w-4"></i> 中午新增預約</button>' +
      '<button data-action="export" ' + (s.exporting ? 'disabled' : '') + ' class="flex items-center gap-2 px-4 py-2.5 bg-green-600 hover:bg-green-700 text-white text-sm font-bold rounded-xl transition shadow-md ' + (s.exporting ? 'opacity-70 cursor-wait' : '') + '">' +
      (s.exporting ? '匯出中...' : '<i data-lucide="download" class="h-4 w-4"></i> 匯出報表') + '</button>' +
      '</div></div>' +
      '<div class="relative w-full"><i data-lucide="search" class="absolute left-4 top-3.5 h-4 w-4 text-gray-400"></i>' +
      '<input type="text" data-oninput="admin-search" value="' + esc(s.search) + '" placeholder="搜尋預約：供應商名稱、Email 或 預約代碼（僅搜尋目前日期區間內）" class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white shadow-sm" /></div>' +
      '</div>' +
      '<div id="admin-table-area"></div>'
    refreshIcons()
    ap.renderTableArea(active, cancelled)
  },

  renderTableArea: function (active, cancelled) {
    var area = qs('#admin-table-area')
    if (!area) return
    var s = ap.state
    if (s.loadingList) { area.innerHTML = '<div class="text-center py-20 text-gray-400">資料載入中...</div>'; return }
    var html = ''
    if (active.length === 0) {
      html += '<div class="text-center py-20 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200"><p class="text-gray-500 font-medium">' +
        (s.search ? '在目前日期區間內找不到符合搜尋條件的預約，請嘗試切換上方日期區間再搜尋' : '目前日期區間內沒有預約資料') + '</p></div>'
    } else {
      html += '<div class="overflow-x-auto rounded-2xl border border-gray-200 shadow-sm max-h-[70vh] overflow-y-auto"><table class="min-w-full divide-y divide-gray-200">' +
        '<thead class="bg-gray-50 sticky top-0 z-10"><tr>' +
        ['日期/時間', 'CODE', '交貨點', '供應商', 'Email/堆高機', '操作'].map(function (h, i) {
          return '<th class="px-6 py-4 text-' + (i === 5 ? 'center' : 'left') + ' text-xs font-bold text-gray-500 uppercase tracking-wider">' + h + '</th>'
        }).join('') + '</tr></thead><tbody class="bg-white divide-y divide-gray-100">' +
        active.map(function (b) {
          return '<tr id="booking-row-' + b.id + '" class="hover:bg-blue-50/50 transition-colors group ' + (b.status === 'completed' ? 'bg-gray-50 opacity-60 grayscale' : '') + ' ' + (s.highlightId === b.id ? 'bg-yellow-100 ring-2 ring-yellow-400' : '') + '">' +
            '<td class="px-6 py-4 whitespace-nowrap"><div class="text-sm font-bold text-gray-800">' + esc(displayDate(b.date)) + '</div><div class="text-sm text-blue-600 font-bold">' + esc(b.time) + '</div></td>' +
            '<td class="px-6 py-4 whitespace-nowrap"><div class="text-xs font-mono text-purple-600 font-bold bg-purple-50 px-2.5 py-1 rounded-lg inline-block border border-purple-100">' + esc(b.bookingCode) + '</div></td>' +
            '<td class="px-6 py-4 whitespace-nowrap"><div class="text-sm text-gray-700 truncate max-w-[120px]" title="' + esc(b.location) + '">' + esc(b.location || '未指定') + '</div></td>' +
            '<td class="px-6 py-4 whitespace-nowrap"><div class="text-sm text-gray-900 font-bold">' + esc(b.supplierName) + '</div></td>' +
            '<td class="px-6 py-4 whitespace-nowrap"><div class="text-xs text-gray-500 mb-1 font-mono">' + esc(b.email) + '</div>' +
            (b.needForklift === 'yes' ? '<span class="text-[10px] font-bold text-orange-600 bg-orange-100 px-2 py-0.5 rounded border border-orange-200">需堆高機</span>' : '') + '</td>' +
            '<td class="px-6 py-4 whitespace-nowrap text-center">' +
            (b.status === 'active'
              ? '<button data-action="mark-complete" data-id="' + b.id + '" ' + (s.updatingId === b.id ? 'disabled' : '') + ' class="inline-flex items-center gap-1 px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-full transition shadow-md">' + (s.updatingId === b.id ? '更新中...' : '<i data-lucide="check-circle-2" class="h-3 w-3"></i> 確認收貨') + '</button>'
              : '<span class="inline-flex items-center gap-1 px-3 py-1 bg-gray-200 text-gray-500 text-xs font-bold rounded-full border border-gray-300">已交貨</span>') +
            '</td></tr>'
        }).join('') + '</tbody></table></div>'
    }
    if (cancelled.length > 0) {
      html += '<div class="mt-8 opacity-75">' +
        '<button data-action="toggle-cancelled" class="w-full text-lg font-bold text-gray-500 mb-4 flex items-center gap-2 border-b pb-2"><i data-lucide="x-circle" class="h-5 w-5"></i> 已取消的預約 (' + cancelled.length + ')' +
        '<i data-lucide="' + (s.showCancelled ? 'chevron-up' : 'chevron-down') + '" class="h-4 w-4 ml-auto"></i></button>' +
        (s.showCancelled ? '' +
          '<div class="overflow-x-auto rounded-2xl border border-gray-200 shadow-sm bg-gray-50"><table class="min-w-full divide-y divide-gray-200">' +
          '<thead class="bg-gray-100"><tr>' + ['日期/時間', 'CODE', '交貨點', '供應商', '狀態'].map(function (h) { return '<th class="px-6 py-3 text-left text-xs font-bold text-gray-400 uppercase tracking-wider">' + h + '</th>' }).join('') + '</tr></thead>' +
          '<tbody class="bg-gray-50 divide-y divide-gray-100 text-gray-400">' +
