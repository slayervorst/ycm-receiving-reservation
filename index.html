  jumpToBooking: function (bookingId) {
    if (!bookingId) return
    if (appState.activeTab !== 'schedule') setActiveTab('schedule')
    ap.state.showHistory = false
    ap.state.view = 'list'
    ap.state.showCancelled = true
    ap.state.highlightId = bookingId
    ap.render()
    if (!ap.state.token) return
    ap.loadBookings()
    setTimeout(function () { ap.state.highlightId = null }, 3000)
  },

  onSubmit: function (action, form) {
    if (action === 'admin-login') {
      var s = ap.state
      s.loginError = ''; s.loggingIn = true
      ap.render()
      api('adminLogin', { password: s.password }).then(function (data) {
        localStorage.setItem('ycm_admin_token', data.token)
        s.token = data.token; s.password = ''; s.loggingIn = false
        ap.mount(ap.host)
      }).catch(function (err) {
        s.loginError = '密碼錯誤或帳號尚未設定'; s.loggingIn = false; s.password = ''; ap.render()
      })
      return
    }
    if (ap.state.view === 'rules' && rm.onSubmit) return rm.onSubmit(action, form)
    if (ap.state.view === 'suppliers' && sm.onSubmit) return sm.onSubmit(action, form)
    if (ap.state.view === 'announcements' && an.onSubmit) return an.onSubmit(action, form)
  },

  onInput: function (action, target) {
    var s = ap.state
    if (action === 'admin-password') { s.password = target.value; return }
    if (action === 'new-password') { s.newPassword = target.value; return }
    if (action === 'confirm-password') { s.confirmPassword = target.value; return }
    if (action === 'admin-search') { s.search = target.value; ap.renderTableArea(ap.filteredBookings().filter(function (b) { return b.status !== 'cancelled' }), ap.filteredBookings().filter(function (b) { return b.status === 'cancelled' })); return }
    if (ap.state.view === 'rules' && rm.onInput) return rm.onInput(action, target)
    if (ap.state.view === 'suppliers' && sm.onInput) return sm.onInput(action, target)
    if (ap.state.view === 'announcements' && an.onInput) return an.onInput(action, target)
  },

  onChange: function (action, target) {
    var s = ap.state
    if (action === 'range-preset') {
      s.rangePreset = target.value
      var today = todayStr()
      if (s.rangePreset === 'today') s.range = { start: today, end: today }
      else if (s.rangePreset === 'past_3') s.range = { start: pastDaysStr(3), end: pastDaysStr(1) }
      else if (s.rangePreset === 'future_3') s.range = { start: addDaysStr(1), end: addDaysStr(3) }
      else if (s.rangePreset === 'past_7') s.range = { start: pastDaysStr(7), end: pastDaysStr(1) }
      else if (s.rangePreset === 'future_7') s.range = { start: addDaysStr(1), end: addDaysStr(7) }
      if (s.rangePreset !== 'custom_range') { ap.renderListView(qs('#admin-subview')); ap.loadBookings() }
      else ap.renderListView(qs('#admin-subview'))
      return
    }
    if (action === 'range-start') { s.range.start = target.value; ap.loadBookings(); return }
    if (action === 'range-end') { s.range.end = target.value; ap.loadBookings(); return }
    if (action === 'noon-show-all') { s.noonShowAll = target.checked; ap.render(); return }
    if (ap.state.view === 'rules' && rm.onChange) return rm.onChange(action, target)
    if (ap.state.view === 'suppliers' && sm.onChange) return sm.onChange(action, target)
    if (ap.state.view === 'announcements' && an.onChange) return an.onChange(action, target)
  },

  onClick: function (action, target) {
    var s = ap.state
    if (action === 'set-view') { s.view = target.getAttribute('data-view'); s.showHistory = false; ap.render(); if (s.view === 'list') ap.loadBookings(); return }
    if (action === 'toggle-history') { s.showHistory = !s.showHistory; ap.render(); return }
    if (action === 'jump-booking') { ap.jumpToBooking(target.getAttribute('data-id')); return }
    if (action === 'open-password-modal') { s.showPasswordModal = true; ap.render(); return }
    if (action === 'close-password-modal') { s.showPasswordModal = false; s.newPassword = ''; s.confirmPassword = ''; ap.render(); return }
    if (action === 'submit-password') {
      if (s.newPassword !== s.confirmPassword) { alert('兩次輸入的密碼不符'); return }
      if (s.newPassword.length < 6) { alert('密碼長度過短（至少 6 碼）'); return }
      if (!window.confirm('確定要修改管理員密碼嗎？')) return
      s.changingPassword = true; ap.render()
      api('adminChangePassword', { token: s.token, newPassword: s.newPassword }).then(function () {
        alert('密碼修改成功！下次登入請使用新密碼。')
        s.showPasswordModal = false; s.newPassword = ''; s.confirmPassword = ''; s.changingPassword = false
        ap.render()
      }).catch(function (err) {
        s.changingPassword = false
        if (ap.isAuthErr(err)) { ap.forceLogout('登入已逾期，請重新登入'); return }
        alert('修改失敗: ' + err.message); ap.render()
      })
      return
    }
    if (action === 'logout') { ap.forceLogout(''); return }
    if (action === 'export') { ap.handleExport(); return }
    if (action === 'refresh-list') { ap.loadBookings(); return }
    if (action === 'open-noon') { s.showNoonModal = true; s.noonBookings = []; ap.loadNoonBookings(); return }
    if (action === 'close-noon' || action === 'close-noon-backdrop') { s.showNoonModal = false; ap.render(); return }
    if (action === 'noon-refresh') { ap.loadNoonBookings(); return }
    if (action === 'noon-export') { ap.exportNoon(); return }
    if (action === 'noon-print') { window.print(); return }
    if (action === 'toggle-cancelled') { s.showCancelled = !s.showCancelled; ap.renderTableArea(ap.filteredBookings().filter(function (b) { return b.status !== 'cancelled' }), ap.filteredBookings().filter(function (b) { return b.status === 'cancelled' })); return }
    if (action === 'mark-complete') {
      var id = target.getAttribute('data-id')
      var b = s.bookings.filter(function (x) { return x.id === id })[0]
      if (!b) return
      if (!window.confirm('確定將 ' + b.supplierName + '（' + b.bookingCode + '）標記為已交貨嗎？')) return
      s.updatingId = id
      ap.renderTableArea(ap.filteredBookings().filter(function (x) { return x.status !== 'cancelled' }), ap.filteredBookings().filter(function (x) { return x.status === 'cancelled' }))
      api('markComplete', { token: s.token, id: id }).then(function () {
        b.status = 'completed'
        toast.push({ type: 'success', title: '已標記收貨', message: b.supplierName + '（' + b.bookingCode + '）已標記為已交貨' })
        s.updatingId = null
        ap.renderTableArea(ap.filteredBookings().filter(function (x) { return x.status !== 'cancelled' }), ap.filteredBookings().filter(function (x) { return x.status === 'cancelled' }))
      }).catch(function (err) {
        s.updatingId = null
        if (ap.isAuthErr(err)) { ap.forceLogout('登入已逾期，請重新登入'); return }
        alert('更新狀態失敗')
        ap.renderTableArea(ap.filteredBookings().filter(function (x) { return x.status !== 'cancelled' }), ap.filteredBookings().filter(function (x) { return x.status === 'cancelled' }))
      })
      return
    }
    if (ap.state.view === 'rules' && rm.onClick) return rm.onClick(action, target)
    if (ap.state.view === 'suppliers' && sm.onClick) return sm.onClick(action, target)
    if (ap.state.view === 'announcements' && an.onClick) return an.onClick(action, target)
  },

  handleExport: function () {
    var active = ap.filteredBookings().filter(function (b) { return b.status !== 'cancelled' })
    if (active.length === 0) return
    ap.state.exporting = true
    ap.renderListView(qs('#admin-subview'))
    loadXLSX().then(function (XLSX) {
      var rows = active.map(function (b) {
        return {
          日期: displayDate(b.date), 時間: b.time, 預約代碼: b.bookingCode, 供應商: b.supplierName, Email: b.email,
          交貨地點: b.location || '', 堆高機需求: b.needForklift === 'yes' ? '是' : '否', 狀態: b.status === 'completed' ? '已交貨' : '預約中',
        }
      })
      var ws = XLSX.utils.json_to_sheet(rows)
      var wb = XLSX.utils.book_new()
      XLSX.utils.book_append_sheet(wb, ws, '預約資料')
      XLSX.writeFile(wb, '預約報表_' + todayStr() + '.xlsx')
      toast.push({ type: 'success', title: '匯出成功', message: '已下載 ' + rows.length + ' 筆預約資料' })
      ap.state.exporting = false
      ap.renderListView(qs('#admin-subview'))
    }).catch(function (err) {
      console.error('Export failed:', err)
      alert('匯出 Excel 失敗，請檢查網路連線後重試')
      ap.state.exporting = false
      ap.renderListView(qs('#admin-subview'))
    })
  },
}

/* ============================================================
 * 預約規則設定（對應原本 components/admin/RulesManager.jsx + RuleCard.jsx）
 * ============================================================ */
function rmEmptyForm() {
  return { type: 'global', mode: 'limit', timeScope: 'all_day', startDate: todayStr(), endDate: todayStr(), categories: [], limit: '', settingMode: 'unified', reason: '' }
}

var rm = {
  host: null,
  state: {
    rules: [], view: 'active', showForm: false, selected: [], selectMode: false, form: rmEmptyForm(), editingId: null,
    submitting: false, year: String(new Date().getFullYear()), importingHolidays: false, holidayPreview: null,
    filterMonth: '', filterCategory: '', filterMode: '', page: 1,
  },

  mount: function (host) {
    rm.host = host
    rm.state.rules = GLOBAL.rules.slice()
    rm.render()
    rm.reload()
  },
  reload: function () { loadBootstrap().then(function () { rm.state.rules = GLOBAL.rules.slice(); rm.render() }).catch(function () {}) },
  authGuard: function (err) { if (ap.isAuthErr(err)) { ap.forceLogout('登入已逾期，請重新登入'); return true } return false },

  computeLists: function () {
    var s = rm.state
    var today = todayStr()
    var currentRules = s.rules.filter(function (r) { return r.type === 'global' || r.endDate >= today })
    var historyRules = s.rules.filter(function (r) { return r.type === 'specific' && r.endDate < today })
    var filtered = (s.view === 'active' ? currentRules : historyRules).filter(function (r) {
      return !(s.filterMode && r.mode !== s.filterMode) &&
        !(s.filterCategory && !(r.categories.indexOf('all') >= 0 || r.categories.indexOf(s.filterCategory) >= 0)) &&
        !(s.filterMonth && r.type === 'specific' && r.startDate.indexOf(s.filterMonth) !== 0)
    })
    var globalRules = s.view === 'active' ? filtered.filter(function (r) { return r.type === 'global' }) : []
    var specificRules = filtered.filter(function (r) { return r.type === 'specific' })
    specificRules.sort(function (a, b) { return s.view === 'active' ? a.startDate.localeCompare(b.startDate) : b.endDate.localeCompare(a.endDate) })
    var pageSize = 12
    var pageStart = (s.page - 1) * pageSize
    var pageRules = specificRules.slice(pageStart, pageStart + pageSize)
    var totalPages = Math.ceil(specificRules.length / pageSize) || 1
    var grouped = {}
    pageRules.forEach(function (r) { var key = r.startDate.substring(0, 7); grouped[key] = grouped[key] || []; grouped[key].push(r) })
    var groupKeys = Object.keys(grouped).sort(function (a, b) { return s.view === 'active' ? a.localeCompare(b) : b.localeCompare(a) })
    var monthOptions = Array.from(new Set(s.rules.filter(function (r) { return r.type === 'specific' }).map(function (r) { return r.startDate.substring(0, 7) }))).sort().reverse()
    var globalLimitRules = s.rules.filter(function (r) { return r.type === 'global' && r.mode === 'limit' })
    return { globalRules: globalRules, specificRules: specificRules, pageStart: pageStart, pageSize: pageSize, totalPages: totalPages, grouped: grouped, groupKeys: groupKeys, monthOptions: monthOptions, globalLimitRules: globalLimitRules }
  },

  ruleCard: function (rule, opts) {
    opts = opts || {}
    var selected = rm.state.selected.indexOf(rule.id) >= 0
    return '' +
      '<div ' + (rm.state.selectMode ? 'data-action="toggle-select-rule" data-id="' + rule.id + '"' : '') + ' class="relative flex flex-col p-4 bg-white border rounded-xl shadow-sm transition-all hover:shadow-md group h-full ' +
      (rule.mode === 'block' ? 'border-t-4 border-t-red-500 border-x border-b' : 'border-t-4 border-t-green-500 border-x border-b') + ' ' +
      (rm.state.selectMode ? 'cursor-pointer' : '') + ' ' + (selected ? 'ring-2 ring-blue-500 border-blue-500 bg-blue-50/20' : 'border-gray-200') + '">' +
      (rm.state.selectMode ? '<div class="absolute top-3 left-3 z-20"><div class="w-5 h-5 rounded border flex items-center justify-center transition-all shadow-sm ' + (selected ? 'bg-blue-600 border-blue-600' : 'bg-white border-gray-300') + '">' + (selected ? '<i data-lucide="check" class="h-3 w-3 text-white"></i>' : '') + '</div></div>' : '') +
      (!rm.state.selectMode && opts.editable ? '<div class="absolute top-2 right-2 flex gap-1 opacity-100 lg:opacity-0 group-hover:opacity-100 z-10">' +
        '<button data-action="edit-rule" data-id="' + rule.id + '" class="p-1.5 text-gray-300 hover:text-blue-500 hover:bg-blue-50 rounded-lg transition" title="編輯規則"><i data-lucide="pencil" class="h-4 w-4"></i></button>' +
        '<button data-action="delete-rule" data-id="' + rule.id + '" class="p-1.5 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition" title="刪除規則"><i data-lucide="trash-2" class="h-4 w-4"></i></button>' +
        '</div>' : '') +
      '<div class="flex flex-col h-full transition-all ' + (rm.state.selectMode ? 'pl-6' : '') + '">' +
      '<div class="mb-3"><div class="flex items-center gap-2 mb-2 flex-wrap">' +
      (rule.type === 'specific'
        ? '<span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs font-bold border border-blue-100 flex items-center gap-1 w-fit"><i data-lucide="calendar" class="h-3 w-3"></i>' + (rule.startDate === rule.endDate ? rule.startDate : rule.startDate + '~' + rule.endDate.slice(5)) + '</span>'
        : '<span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs font-bold border border-slate-200">全域預設</span>') +
      (rule.timeScope !== 'all_day' ? '<span class="px-2 py-1 rounded text-xs border font-medium ' + (rule.timeScope === 'am' ? 'bg-yellow-50 text-yellow-700 border-yellow-100' : 'bg-indigo-50 text-indigo-700 border-indigo-100') + '">' + (rule.timeScope === 'am' ? '上午' : '下午') + '</span>' : '') +
      '</div><div class="flex items-center gap-2">' +
      (rule.mode === 'block' ? '<span class="text-red-600 font-bold text-sm flex items-center gap-1"><i data-lucide="ban" class="h-4 w-4"></i> 暫停預約</span>' : '<span class="text-green-600 font-bold text-sm flex items-center gap-1"><i data-lucide="check-circle-2" class="h-4 w-4"></i> 限額: ' + esc(rule.limit) + '</span>') +
      '</div></div>' +
      '<div class="mt-auto space-y-2"><div class="text-gray-500 text-xs flex items-center gap-1.5 border-t border-gray-100 pt-2">' +
      '<i data-lucide="tag" class="h-3 w-3 shrink-0"></i><span class="truncate font-medium" title="' + esc(rule.categories.join(', ')) + '">' + (rule.categories.indexOf('all') >= 0 ? '全部類別' : esc(rule.categories.join(', '))) + '</span></div>' +
      (rule.mode === 'block' && rule.reason ? '<div class="text-xs text-red-600 bg-red-50 px-2 py-1.5 rounded text-center font-medium border border-red-100 truncate">' + esc(rule.reason) + '</div>' : '') +
      '</div></div></div>'
  },

  render: function () {
    if (!rm.host) return
    var s = rm.state
    var d = rm.computeLists()
    var thisYear = new Date().getFullYear()

    var html = '<div class="bg-white rounded-xl p-4 sm:p-6 border border-gray-200 shadow-sm mt-4 relative pb-20">' +
      '<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">' +
      '<h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="settings" class="h-5 w-5"></i> 預約規則設定</h3>' +
      '<div class="flex flex-wrap gap-2 w-full sm:w-auto">' +
      '<div class="flex items-center gap-2 bg-slate-50 p-1 rounded-lg border border-gray-200 ml-auto sm:ml-0">' +
      '<select data-onchange="holiday-year" class="text-sm font-bold py-1.5 pl-2 pr-6 border-gray-300 rounded-md bg-white border outline-none">' +
      '<option value="' + thisYear + '" ' + (s.year == thisYear ? 'selected' : '') + '>' + thisYear + '</option>' +
      '<option value="' + (thisYear + 1) + '" ' + (s.year == thisYear + 1 ? 'selected' : '') + '>' + (thisYear + 1) + '</option></select>' +
      '<button data-action="load-holidays" ' + (s.importingHolidays ? 'disabled' : '') + ' class="text-xs px-3 py-2 rounded-md bg-blue-600 text-white font-bold flex items-center gap-1 hover:bg-blue-700 disabled:opacity-50">' +
      '<i data-lucide="' + (s.importingHolidays ? 'refresh-cw' : 'download') + '" class="h-3 w-3"></i> 下載</button></div>' +
      (!s.showForm ? '<button data-action="open-rule-form" class="px-4 py-2 bg-slate-800 text-white text-sm font-bold rounded-lg hover:bg-black transition flex items-center gap-2"><i data-lucide="plus" class="h-4 w-4"></i> 新增</button>' : '') +
      '</div></div>' +

      '<div class="text-xs text-slate-500 bg-slate-50 border border-slate-100 rounded-lg px-3 py-2 mb-6">' +
      (d.globalLimitRules.length === 0
        ? '目前沒有設定「全域預設」的可預約數規則，每個時段預設上限為 <strong>' + DEFAULT_SLOT_CAPACITY + '</strong> 筆。'
        : '目前生效中的全域預設上限：' + d.globalLimitRules.map(function (r) { return '<strong>' + (r.categories.indexOf('all') >= 0 ? '全部類別' : esc(r.categories.join('/'))) + ': ' + esc(r.limit) + '</strong>' }).join('、') + '（未涵蓋到的類別仍套用預設值 ' + DEFAULT_SLOT_CAPACITY + '）') +
      '</div>'

    if (s.holidayPreview) {
      html += '<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto" data-action="close-holiday-preview-backdrop">' +
        '<div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl">' +
        '<h4 class="font-bold text-gray-800 mb-1">確認匯入 ' + s.year + ' 年國定假日</h4><p class="text-sm text-gray-500 mb-4">將建立 ' + s.holidayPreview.length + ' 筆「暫停預約」規則：</p>' +
        '<div class="max-h-64 overflow-y-auto border border-gray-100 rounded-lg divide-y divide-gray-100 mb-6">' +
        s.holidayPreview.map(function (h) { return '<div class="px-3 py-2 text-sm flex justify-between"><span class="text-gray-500">' + esc(h.date) + '</span><span class="text-gray-800 font-medium">' + esc(h.reason) + '</span></div>' }).join('') +
        '</div><div class="flex justify-end gap-3">' +
        '<button data-action="close-holiday-preview" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg text-sm font-bold">取消</button>' +
        '<button data-action="confirm-import-holidays" ' + (s.importingHolidays ? 'disabled' : '') + ' class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold hover:bg-blue-700 disabled:opacity-50">' + (s.importingHolidays ? '匯入中...' : '確認匯入 ' + s.holidayPreview.length + ' 筆') + '</button>' +
        '</div></div></div>'
    }

    if (s.showForm) html += rm.renderForm()

    html += '<div class="flex border-b border-gray-200 mb-6">' +
      ['active:生效中規則', 'history:歷史規則紀錄'].map(function (p) {
        var parts = p.split(':')
        return '<button data-action="rule-view" data-view="' + parts[0] + '" class="pb-3 px-6 text-sm font-bold transition-all relative ' + (s.view === parts[0] ? 'text-blue-600' : 'text-gray-400 hover:text-gray-600') + '">' + parts[1] +
          (s.view === parts[0] ? '<div class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 rounded-t-full"></div>' : '') + '</button>'
      }).join('') + '</div>' +

      '<div class="flex flex-wrap items-center gap-3 mb-6 bg-slate-50 p-3 rounded-xl border border-slate-100">' +
      '<div class="flex items-center gap-2 text-xs font-bold text-slate-500 uppercase">篩選條件:</div>' +
      '<select data-onchange="filter-month" class="pl-3 pr-8 py-1.5 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white"><option value="">所有月份</option>' +
      d.monthOptions.map(function (m) { return '<option value="' + m + '" ' + (s.filterMonth === m ? 'selected' : '') + '>' + m + '</option>' }).join('') + '</select>' +
      '<select data-onchange="filter-category" class="pl-3 pr-8 py-1.5 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white"><option value="">所有類別</option>' +
      LOCATIONS.map(function (l) { return '<option value="' + esc(l.name) + '" ' + (s.filterCategory === l.name ? 'selected' : '') + '>' + esc(l.name) + '</option>' }).join('') + '</select>' +
      '<select data-onchange="filter-mode" class="pl-3 pr-8 py-1.5 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white"><option value="">所有狀態</option>' +
      '<option value="limit" ' + (s.filterMode === 'limit' ? 'selected' : '') + '>可預約 (限額)</option><option value="block" ' + (s.filterMode === 'block' ? 'selected' : '') + '>暫停預約 (封鎖)</option></select>' +
      '<button data-action="toggle-select-mode" class="ml-2 px-3 py-1.5 text-xs font-bold rounded border transition ' + (s.selectMode ? 'bg-blue-100 text-blue-700 border-blue-300' : 'bg-white text-gray-500 hover:bg-gray-50') + '">' + (s.selectMode ? '取消選取' : '批次選取') + '</button>' +
      ((s.filterMonth || s.filterCategory || s.filterMode) ? '<button data-action="clear-filters" class="text-xs text-red-500 hover:text-red-700 font-bold ml-auto px-2">清除篩選</button>' : '') +
      '</div>'

    html += '<div class="space-y-8 min-h-[300px]">'
    if (d.globalRules.length === 0 && d.groupKeys.length === 0) {
      html += '<div class="text-center py-12 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200"><p class="text-gray-400 font-medium">沒有符合條件的規則</p></div>'
    } else {
      if (s.view === 'active' && d.globalRules.length > 0 && s.page === 1) {
        html += '<div class="animate-fade-in"><h5 class="text-xs font-bold text-gray-400 uppercase mb-3 pl-1 flex items-center gap-2">全域通用設定</h5>' +
          '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">' + d.globalRules.map(function (r) { return rm.ruleCard(r, { editable: true }) }).join('') + '</div></div>'
      }
      if (d.groupKeys.length > 0) {
        html += '<div class="animate-fade-in">' + (s.view === 'active' && d.globalRules.length > 0 && s.page === 1 ? '<hr class="my-6 border-gray-100" />' : '')
        d.groupKeys.forEach(function (key) {
          var parts = key.split('-')
          html += '<div class="mb-6 last:mb-0"><h5 class="sticky top-0 z-10 bg-white/95 backdrop-blur py-2 text-sm font-bold text-slate-800 border-b border-gray-100 mb-3">' + parts[0] + '年 ' + parts[1] + '月</h5>' +
            '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pl-0 sm:pl-2">' + d.grouped[key].map(function (r) { return rm.ruleCard(r, { editable: s.view === 'active' }) }).join('') + '</div></div>'

  renderForm: function () {

      '<h4 class="font-bold text-blue-800 text-sm mb-6 flex items-center gap-2"><i data-lucide="plus" class="h-4 w-4"></i> ' + (s.editingId ? '編輯規則設定' : '新增規則設定') + '</h4>' +

      '<i data-lucide="chevron-down" class="absolute right-3 top-3 h-4 w-4 text-gray-400 pointer-events-none"></i></div></div>' +

      '<select data-onchange="form-mode" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none appearance-none bg-white">' +
      '<option value="limit" ' + (f.mode === 'limit' ? 'selected' : '') + '>設定可預約數</option><option value="block" ' + (f.mode === 'block' ? 'selected' : '') + '>暫停/不接受預約</option></select>' +
      '<i data-lucide="chevron-down" class="absolute right-3 top-3 h-4 w-4 text-gray-400 pointer-events-none"></i></div></div></div>' +

      (f.type === 'specific' ? '' +
        '<div class="grid grid-cols-2 gap-6 bg-slate-50 p-4 rounded-xl border border-slate-100">' +
        '<div><label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">開始日期</label><input type="date" data-onchange="form-start" value="' + f.startDate + '" class="w-full p-2 border border-gray-300 rounded-lg text-sm" /></div>' +
        '<div><label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">結束日期</label><input type="date" data-onchange="form-end" value="' + f.endDate + '" class="w-full p-2 border border-gray-300 rounded-lg text-sm" /></div></div>' +
        '<div><label class="block text-xs font-bold text-gray-500 uppercase mb-2">時段範圍</label><div class="flex gap-4">' +
        ['all_day:全天', 'am:上午', 'pm:下午'].map(function (p) {
          var parts = p.split(':')
          return '<label class="flex items-center gap-2 cursor-pointer bg-gray-50 px-3 py-2 rounded-lg hover:bg-gray-100 transition"><input type="radio" name="timeScope" data-onchange="form-scope" value="' + parts[0] + '" ' + (f.timeScope === parts[0] ? 'checked' : '') + ' class="text-blue-600 focus:ring-blue-500 w-4 h-4" /><span class="text-sm text-gray-700 font-medium">' + parts[1] + '</span></label>'
        }).join('') + '</div></div>' : '') +

      '<div><label class="block text-xs font-bold text-gray-500 uppercase mb-2">適用類別</label><div class="flex flex-wrap gap-2">' +
      '<button data-action="toggle-form-category" data-name="all" class="px-3 py-1.5 text-xs font-bold rounded-full border transition-all ' + (f.categories.indexOf('all') >= 0 ? 'bg-slate-800 text-white border-slate-800' : 'bg-white border-gray-200 text-gray-500 hover:border-gray-400') + '">全部類別</button>' +
      LOCATIONS.map(function (loc) {
        return '<button data-action="toggle-form-category" data-name="' + esc(loc.name) + '" class="px-3 py-1.5 text-xs font-bold rounded-full border transition-all ' + (f.categories.indexOf(loc.name) >= 0 ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-gray-200 text-gray-500 hover:border-gray-400') + '">' + esc(loc.name) + '</button>'
      }).join('') + '</div></div>' +

      (f.mode === 'limit' ? '' +
        '<div class="bg-green-50 p-4 rounded-xl border border-green-100"><label class="block text-xs font-bold text-green-800 uppercase mb-2">設定數值</label>' +
        (!s.editingId ? '<div class="flex gap-6 mb-4">' +
          '<label class="flex items-center gap-2 cursor-pointer"><input type="radio" data-onchange="form-setting-mode" value="unified" ' + (f.settingMode === 'unified' ? 'checked' : '') + ' class="text-green-600 focus:ring-green-500 w-4 h-4" /><span class="text-sm text-green-900 font-medium">統一設定 (共用額度)</span></label>' +
          '<label class="flex items-center gap-2 cursor-pointer"><input type="radio" data-onchange="form-setting-mode" value="separate" ' + (f.settingMode === 'separate' ? 'checked' : '') + ' class="text-green-600 focus:ring-green-500 w-4 h-4" /><span class="text-sm text-green-900 font-medium">單獨設定 (各別額度)</span></label></div>' : '') +
        (!s.editingId && f.categories.length > 1 ? '<p class="text-xs text-green-700 mb-3">' +
          (f.settingMode === 'unified' ? '例：選了「' + esc(f.categories.join('、')) + '」，統一設定 = 這幾個類別加起來共用同一份名額（額滿一次就全部額滿）。' : '例：選了「' + esc(f.categories.join('、')) + '」，單獨設定 = 每個類別各自有獨立的名額，會建立 ' + f.categories.length + ' 筆規則。') + '</p>' : '') +
        '<input type="number" data-oninput="form-limit" value="' + esc(f.limit) + '" class="w-full p-2.5 border border-green-300 rounded-lg text-sm focus:ring-2 focus:ring-green-500 outline-none" placeholder="請輸入每時段可預約數量" /></div>' : '') +

      (f.mode === 'block' ? '<div class="bg-red-50 p-4 rounded-xl border border-red-100"><label class="block text-xs font-bold text-red-800 uppercase mb-2">暫停原因</label>' +
        '<input type="text" data-oninput="form-reason" value="' + esc(f.reason) + '" class="w-full p-2.5 border border-red-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 outline-none" placeholder="例：年度盤點暫停收貨" /></div>' : '') +

      '<div class="flex justify-end gap-3 pt-4 border-t border-gray-100">' +
      '<button data-action="close-rule-form" class="px-5 py-2.5 text-gray-600 text-sm font-bold hover:bg-gray-100 rounded-lg transition">取消</button>' +

      '</div></div></div></div>'
  },

  onChange: function (action, target) {
    var s = rm.state, f = s.form
    if (action === 'holiday-year') { s.year = target.value; return }
    if (action === 'form-type') { f.type = target.value; rm.render(); return }
    if (action === 'form-mode') { f.mode = target.value; rm.render(); return }
    if (action === 'form-start') { f.startDate = target.value; return }
    if (action === 'form-end') { f.endDate = target.value; return }
    if (action === 'form-scope') { f.timeScope = target.value; return }
    if (action === 'form-setting-mode') { f.settingMode = target.value; rm.render(); return }
    if (action === 'filter-month') { s.filterMonth = target.value; s.page = 1; rm.render(); return }
    if (action === 'filter-category') { s.filterCategory = target.value; s.page = 1; rm.render(); return }
    if (action === 'filter-mode') { s.filterMode = target.value; s.page = 1; rm.render(); return }
  },

  onInput: function (action, target) {
    var f = rm.state.form
    if (action === 'form-limit') { f.limit = target.value; return }
    if (action === 'form-reason') { f.reason = target.value; return }
  },

  onClick: function (action, target) {
    var s = rm.state, f = s.form
    if (action === 'rule-view') { s.view = target.getAttribute('data-view'); s.page = 1; rm.render(); return }
    if (action === 'open-rule-form') { s.form = rmEmptyForm(); s.editingId = null; s.showForm = true; rm.render(); return }
    if (action === 'close-rule-form' || action === 'close-rule-form-backdrop') { s.showForm = false; s.editingId = null; s.form = rmEmptyForm(); rm.render(); return }
    if (action === 'toggle-form-category') {
      var name = target.getAttribute('data-name')
      var cats = f.categories.slice()
      if (name === 'all') cats = ['all']
      else { if (cats.indexOf('all') >= 0) cats = []; cats = cats.indexOf(name) >= 0 ? cats.filter(function (c) { return c !== name }) : cats.concat([name]) }
      f.categories = cats
      rm.render()
      return
    }
    if (action === 'submit-rule') { rm.submitRule(); return }
    if (action === 'load-holidays') { rm.loadHolidayPreview(); return }
    if (action === 'close-holiday-preview' || action === 'close-holiday-preview-backdrop') { s.holidayPreview = null; rm.render(); return }
    if (action === 'confirm-import-holidays') { rm.confirmImportHolidays(); return }
    if (action === 'edit-rule') {
      var rule = s.rules.filter(function (r) { return r.id === target.getAttribute('data-id') })[0]
      if (!rule) return
      s.form = { type: rule.type, mode: rule.mode, timeScope: rule.timeScope, startDate: rule.startDate || todayStr(), endDate: rule.endDate || todayStr(), categories: rule.categories.slice(), limit: rule.limit || '', settingMode: 'unified', reason: rule.reason || '' }
      s.editingId = rule.id
      s.showForm = true
      rm.render()
      return
    }
    if (action === 'delete-rule') {
      if (!window.confirm('確定刪除此規則？')) return
      var id = target.getAttribute('data-id')
      api('deleteRule', { token: ap.state.token, id: id }).then(rm.reload).catch(function (err) { if (!rm.authGuard(err)) console.error(err) })
      return
    }
    if (action === 'toggle-select-rule') {
      var rid = target.getAttribute('data-id')
      s.selected = s.selected.indexOf(rid) >= 0 ? s.selected.filter(function (x) { return x !== rid }) : s.selected.concat([rid])
      rm.render()
      return
    }
    if (action === 'toggle-select-mode') { s.selectMode = !s.selectMode; s.selected = []; rm.render(); return }
    if (action === 'clear-filters') { s.filterMonth = ''; s.filterCategory = ''; s.filterMode = ''; rm.render(); return }
    if (action === 'clear-selected') { s.selected = []; rm.render(); return }
    if (action === 'batch-delete-rules') {
      if (s.selected.length === 0 || !window.confirm('確定要刪除選取的 ' + s.selected.length + ' 筆規則嗎？此動作無法復原。')) return
      s.submitting = true
      api('deleteRulesBatch', { token: ap.state.token, ids: s.selected }).then(function () {
        alert('已成功刪除 ' + s.selected.length + ' 筆規則')
        s.selected = []; s.selectMode = false; s.submitting = false
        rm.reload()
      }).catch(function (err) { s.submitting = false; if (!rm.authGuard(err)) alert('批次刪除失敗') })
      return
    }
    if (action === 'rule-page') {
      var dir = parseInt(target.getAttribute('data-dir'), 10)
      var d = rm.computeLists()
      s.page = Math.max(1, Math.min(d.totalPages, s.page + dir))
      rm.render()
      return
    }
  },

  submitRule: function () {
    var s = rm.state, f = s.form
    if (f.categories.length === 0) return alert('請至少選擇一個類別')
    if (f.mode === 'block' && !f.reason) return alert('請填寫暫停預約的原因')
    if (f.mode === 'limit' && !f.limit) return alert('請填寫每時段可預約數')
    s.submitting = true
    rm.render()
    var req
    if (s.editingId) req = api('updateRule', { token: ap.state.token, id: s.editingId, rule: f }).then(function () { alert('規則已更新') })
    else if (f.settingMode === 'separate' && f.mode === 'limit') req = api('addRulesBatch', { token: ap.state.token, rules: f.categories.map(function (c) { return Object.assign({}, f, { categories: [c], settingMode: 'unified' }) }) }).then(function () { alert('規則已新增') })
    else req = api('addRule', { token: ap.state.token, rule: f }).then(function () { alert('規則已新增') })
    req.then(function () {
      s.form = rmEmptyForm(); s.editingId = null; s.showForm = false; s.submitting = false
      rm.reload()
    }).catch(function (err) {
      s.submitting = false
      if (!rm.authGuard(err)) alert(s.editingId ? '更新失敗' : '新增失敗')
      rm.render()
    })
  },

  loadHolidayPreview: function () {
    var s = rm.state
    s.importingHolidays = true
    rm.render()
    fetch('https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/' + s.year + '.json')
      .then(function (res) { if (!res.ok) throw new Error('找不到 ' + s.year + ' 年的資料，政府可能尚未公告或網路錯誤。'); return res.json() })
      .then(function (data) {
        var holidays = data.filter(function (d) { return d.isHoliday === true && d.description })
        if (holidays.length === 0) { alert('該年度沒有找到符合的假日資料。'); return }
        s.holidayPreview = holidays.map(function (h) { return { date: h.date.substring(0, 4) + '-' + h.date.substring(4, 6) + '-' + h.date.substring(6, 8), reason: h.description } })
      })
      .catch(function (err) { console.error('Fetch failed:', err); alert('匯入失敗：' + err.message) })
      .then(function () { s.importingHolidays = false; rm.render() })
  },

  confirmImportHolidays: function () {
    var s = rm.state
    s.importingHolidays = true
    rm.render()
    api('addRulesBatch', {
      token: ap.state.token,
      rules: s.holidayPreview.map(function (h) { return { type: 'specific', mode: 'block', timeScope: 'all_day', startDate: h.date, endDate: h.date, categories: ['all'], reason: h.reason } }),
    }).then(function () {
      alert('成功匯入 ' + s.holidayPreview.length + ' 筆 ' + s.year + ' 年國定假日！')
      s.holidayPreview = null
      rm.reload()
    }).catch(function (err) { if (!rm.authGuard(err)) alert('匯入失敗：' + (err.message || '')) })
      .then(function () { s.importingHolidays = false; rm.render() })
  },
}

        '<button data-action="confirm-import-suppliers" ' + (s.submitting ? 'disabled' : '') + ' class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-bold hover:bg-green-700 disabled:opacity-50">' + (s.submitting ? '匯入中...' : '確認匯入 ' + s.importPreview.length + ' 筆') + '</button>' +
        '</div></div></div>' : '') +

      '<div class="mb-4 relative"><i data-lucide="search" class="absolute left-3 top-2.5 h-4 w-4 text-gray-400"></i>' +
      '<input type="text" data-oninput="sup-search" value="' + esc(s.search) + '" placeholder="搜尋供應商名稱或主檔號碼..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-500 outline-none text-sm" /></div>' +

      '<div id="supplier-table-area"></div></div>'
    refreshIcons()
    sm.renderTable()
  },

  renderTable: function () {
    var area = qs('#supplier-table-area')
    if (!area) return
    var s = sm.state
    var filtered = sm.filtered()
    var pageSize = 10
    var pageStart = (s.page - 1) * pageSize
    var pageItems = filtered.slice(pageStart, pageStart + pageSize)
    var totalPages = Math.ceil(filtered.length / pageSize) || 1

    area.innerHTML = '' +
      '<div class="border border-gray-200 rounded-lg overflow-x-auto mb-4"><table class="min-w-full divide-y divide-gray-200">' +
      '<thead class="bg-gray-50"><tr>' +
      '<th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-24">序號</th>' +
      '<th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-32">供應商主檔</th>' +
      '<th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">供應商名稱</th>' +
      '<th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-40">加入時間</th>' +
      '<th class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase tracking-wider w-24">操作</th></tr></thead>' +
      '<tbody class="bg-white divide-y divide-gray-200">' +
      (pageItems.length === 0 ? '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-400 text-sm">沒有找到符合的供應商資料</td></tr>' :
        pageItems.map(function (s2, i) {
          return '<tr class="hover:bg-slate-50 transition">' +
            '<td class="px-6 py-3 whitespace-nowrap text-sm text-gray-400">' + (pageStart + i + 1) + '</td>' +
            '<td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500 font-mono">' + esc(s2.masterId || '-') + '</td>' +
            '<td class="px-6 py-3 whitespace-nowrap text-sm font-medium text-gray-900">' + esc(s2.name) + '</td>' +
            '<td class="px-6 py-3 whitespace-nowrap text-sm text-gray-400">' + formatTimestamp(s2.createdAt) + '</td>' +
            '<td class="px-6 py-3 whitespace-nowrap text-right text-sm font-medium"><button data-action="sup-delete" data-id="' + s2.id + '" class="text-red-400 hover:text-red-600 transition"><i data-lucide="trash-2" class="h-4 w-4"></i></button></td></tr>'
        }).join('')) +
      '</tbody></table></div>' +
      '<div class="flex items-center justify-between px-2">' +
      '<div class="text-sm text-gray-500">顯示 ' + (filtered.length > 0 ? pageStart + 1 : 0) + ' 到 ' + Math.min(s.page * pageSize, filtered.length) + ' 筆，共 ' + filtered.length + ' 筆</div>' +
      '<div class="flex gap-1">' +
      '<button data-action="sup-page" data-dir="-1" ' + (s.page === 1 ? 'disabled' : '') + ' class="p-1 rounded hover:bg-gray-100 disabled:opacity-30"><i data-lucide="chevron-left" class="h-5 w-5 text-gray-600"></i></button>' +
      '<div class="px-3 py-1 bg-gray-100 rounded text-sm font-medium text-gray-700">' + s.page + ' / ' + totalPages + '</div>' +
      '<button data-action="sup-page" data-dir="1" ' + (s.page === totalPages ? 'disabled' : '') + ' class="p-1 rounded hover:bg-gray-100 disabled:opacity-30"><i data-lucide="chevron-right" class="h-5 w-5 text-gray-600"></i></button>' +
      '</div></div>'
    refreshIcons()
  },

  onInput: function (action, target) {
    var s = sm.state
    if (action === 'sup-master-id') { s.masterId = target.value; return }
    if (action === 'sup-name') { s.name = target.value; return }
    if (action === 'sup-search') { s.search = target.value; s.page = 1; sm.renderTable(); return }
  },

  onChange: function (action, target) {
    if (action === 'sup-file') { sm.state.file = target.files[0] || null; sm.render(); return }
  },

  onClick: function (action, target) {
    var s = sm.state
    if (action === 'sup-mode') { s.mode = target.getAttribute('data-mode'); sm.render(); return }
    if (action === 'sup-add') { sm.handleAdd(); return }
    if (action === 'sup-preview-import') { sm.handlePreviewImport(); return }
    if (action === 'close-import-preview' || action === 'close-import-preview-backdrop') { s.importPreview = null; sm.render(); return }
    if (action === 'confirm-import-suppliers') { sm.confirmImport(); return }
    if (action === 'sup-delete') {
      if (!window.confirm('確定刪除此供應商？')) return
      var id = target.getAttribute('data-id')
      api('deleteSupplier', { token: ap.state.token, id: id }).then(sm.reload).catch(function (err) { if (!sm.authGuard(err)) alert('刪除失敗') })
      return
    }
    if (action === 'sup-page') {
      var dir = parseInt(target.getAttribute('data-dir'), 10)
      var totalPages = Math.ceil(sm.filtered().length / 10) || 1
      s.page = Math.max(1, Math.min(totalPages, s.page + dir))
      sm.renderTable()
      return
    }
  },

  handleAdd: function () {
    var s = sm.state
    if (!s.name.trim()) return
    s.submitting = true
    sm.render()
    api('addSupplier', { token: ap.state.token, name: s.name, masterId: s.masterId }).then(function () {
      s.name = ''; s.masterId = ''; s.submitting = false
      sm.reload()
    }).catch(function (err) { s.submitting = false; if (!sm.authGuard(err)) alert('新增失敗'); sm.render() })
  },

  handlePreviewImport: function () {
    var s = sm.state
    if (!s.file) return alert('請先選擇 Excel 檔案')
    s.submitting = true
    sm.render()
    loadXLSX().then(function (XLSX) {
      return s.file.arrayBuffer().then(function (buf) {
        var wb = XLSX.read(buf, { type: 'array' })
        var sheet = wb.Sheets[wb.SheetNames[0]]
        var rows = XLSX.utils.sheet_to_json(sheet, { header: 1 })
          .filter(function (r) { return r.length > 0 })
          .map(function (r) {
            var masterId = '', supplierName = ''
            if (r.length >= 2) { masterId = String(r[0] || '').trim(); supplierName = String(r[1] || '').trim() }
            else if (r.length === 1) { supplierName = String(r[0] || '').trim() }
            return { masterId: masterId, name: supplierName }
          })
          .filter(function (r) { return r.name.length > 0 && r.name !== '供應商名稱' && r.name !== 'Name' })
        if (rows.length === 0) { alert('檔案中找不到有效的供應商資料 (請確認格式: 第一欄=主檔號碼, 第二欄=名稱)'); return }
        s.importPreview = rows
      })
    }).catch(function (err) { console.error('Parse failed:', err); alert('讀取檔案失敗: ' + err.message) })
      .then(function () { s.submitting = false; sm.render() })
  },

  confirmImport: function () {
    var s = sm.state
    s.submitting = true
    sm.render()
    api('importSuppliersBatch', { token: ap.state.token, rows: s.importPreview }).then(function (data) {
      alert('成功匯入 ' + (data.count != null ? data.count : s.importPreview.length) + ' 筆供應商資料')
      s.importPreview = null; s.file = null; s.submitting = false
      sm.reload()
    }).catch(function (err) {
      s.submitting = false
      if (!sm.authGuard(err)) alert('匯入失敗: ' + (err.message || ''))
      sm.render()
    })
  },
}

/* ============================================================
 * 公告設定（後台管理，對應 GLOBAL.announcements 的維護介面）
 * ============================================================ */
var an = {
  host: null,
  state: {
    list: [], loading: false, form: { message: '', active: true }, editingId: null,
    submitting: false, togglingId: null, deletingId: null,
  },

  mount: function (host) {
    an.host = host
    an.state.editingId = null
    an.state.form = { message: '', active: true }
    an.render()
    an.reload()
  },

  authGuard: function (err) { if (ap.isAuthErr(err)) { ap.forceLogout('登入已逾期，請重新登入'); return true } return false },

  reload: function () {
    an.state.loading = true
    an.render()
    api('adminListAnnouncements', { token: ap.state.token }).then(function (data) {
      an.state.list = data.announcements || []
      an.state.loading = false
      an.render()
    }).catch(function (err) {
      an.state.loading = false
      if (!an.authGuard(err)) alert('讀取公告失敗')
      an.render()
    })
  },

  // 後台維護完公告後，順便同步一份給預約頁/管理預約頁用的 GLOBAL.announcements（只含啟用中的）
  syncGlobal: function () { refreshAnnouncements() },

  render: function () {
    if (!an.host) return
    var s = an.state
    var f = s.form
    an.host.innerHTML = '' +
      '<div class="bg-white rounded-xl p-6 border border-gray-200 shadow-sm mt-4">' +
      '<div class="flex justify-between items-center mb-2"><h3 class="text-lg font-bold text-gray-800 flex items-center gap-2"><i data-lucide="megaphone" class="h-5 w-5"></i> 公告設定</h3></div>' +
      '<p class="text-xs text-gray-500 mb-6">在這裡新增的「啟用中」公告，會顯示在供應商的「預約交貨」與「管理預約」頁面最上方，方便通知停班停電、系統維護、規則調整等事項。</p>' +

      '<div class="bg-slate-50 p-5 rounded-xl border border-slate-200 mb-6 space-y-3">' +
      '<label class="block text-xs font-bold text-gray-500">' + (s.editingId ? '編輯公告內容' : '新增公告內容') + '</label>' +
      '<textarea data-oninput="an-message" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-slate-500 text-sm" placeholder="輸入公告內容，例如：9/20（六）9/21（日）公司放假，暫停收貨，請提前預約。">' + esc(f.message) + '</textarea>' +
      '<div class="flex items-center justify-between flex-wrap gap-3">' +
      '<label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer"><input type="checkbox" data-onchange="an-active" ' + (f.active ? 'checked' : '') + ' class="w-4 h-4" /> 立即啟用（顯示在對外頁面）</label>' +
      '<div class="flex gap-2">' +
      (s.editingId ? '<button data-action="an-cancel-edit" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg text-sm font-bold">取消編輯</button>' : '') +
      '<button data-action="an-submit" ' + (s.submitting ? 'disabled' : '') + ' class="px-6 py-2 bg-slate-800 text-white rounded-lg hover:bg-slate-900 transition disabled:opacity-50 font-bold">' +
      (s.submitting ? '處理中...' : (s.editingId ? '儲存修改' : '新增公告')) + '</button>' +
      '</div></div></div>' +

      '<div id="announcement-list-area"></div></div>'
    refreshIcons()
    an.renderList()
  },

  renderList: function () {
    var area = qs('#announcement-list-area')
    if (!area) return
    var s = an.state
    if (s.loading && s.list.length === 0) { area.innerHTML = '<div class="text-center py-10 text-gray-400">資料載入中...</div>'; refreshIcons(); return }
    if (s.list.length === 0) { area.innerHTML = '<div class="text-center py-10 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200 text-gray-500 font-medium">目前沒有任何公告</div>'; refreshIcons(); return }
    area.innerHTML = '<div class="space-y-3">' +
      s.list.map(function (a) {
        return '' +
          '<div class="border rounded-xl p-4 flex items-start gap-3 ' + (a.active ? 'border-amber-200 bg-amber-50/50' : 'border-gray-200 bg-gray-50 opacity-70') + '">' +
          '<i data-lucide="megaphone" class="h-5 w-5 mt-0.5 shrink-0 ' + (a.active ? 'text-amber-600' : 'text-gray-400') + '"></i>' +
          '<div class="flex-1 min-w-0">' +
          '<p class="text-sm text-gray-800 whitespace-pre-wrap break-words">' + esc(a.message) + '</p>' +
          '<p class="text-xs text-gray-400 mt-1">' + (a.active ? '<span class="text-green-600 font-bold">啟用中</span>' : '<span class="text-gray-400 font-bold">已停用</span>') + '　建立於 ' + formatTimestamp(a.createdAt) + '</p></div>' +
          '<div class="flex gap-1 shrink-0">' +
          '<button data-action="an-toggle" data-id="' + a.id + '" ' + (s.togglingId === a.id ? 'disabled' : '') + ' title="' + (a.active ? '停用' : '啟用') + '" class="p-2 text-gray-400 hover:text-slate-700 hover:bg-gray-100 rounded-lg transition"><i data-lucide="' + (a.active ? 'eye-off' : 'eye') + '" class="h-4 w-4"></i></button>' +
          '<button data-action="an-edit" data-id="' + a.id + '" title="編輯" class="p-2 text-gray-400 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition"><i data-lucide="pencil" class="h-4 w-4"></i></button>' +
          '<button data-action="an-delete" data-id="' + a.id + '" ' + (s.deletingId === a.id ? 'disabled' : '') + ' title="刪除" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition"><i data-lucide="trash-2" class="h-4 w-4"></i></button>' +
          '</div></div>'
      }).join('') + '</div>'
    refreshIcons()
  },

  onInput: function (action, target) {
    if (action === 'an-message') { an.state.form.message = target.value; return }
  },

  onChange: function (action, target) {
    if (action === 'an-active') { an.state.form.active = target.checked; return }
  },

  onClick: function (action, target) {
    var s = an.state
    if (action === 'an-submit') { an.handleSubmit(); return }
    if (action === 'an-cancel-edit') { s.editingId = null; s.form = { message: '', active: true }; an.render(); return }
    if (action === 'an-edit') {
      var id = target.getAttribute('data-id')
      var item = s.list.filter(function (a) { return a.id === id })[0]
      if (!item) return
      s.editingId = id
      s.form = { message: item.message, active: item.active }
      an.render()
      return
    }
    if (action === 'an-toggle') {
      var tid = target.getAttribute('data-id')
      var t = s.list.filter(function (a) { return a.id === tid })[0]
      if (!t) return
      s.togglingId = tid
      an.renderList()
      api('updateAnnouncement', { token: ap.state.token, id: tid, active: !t.active }).then(function () {
        s.togglingId = null
        an.syncGlobal()
        an.reload()
      }).catch(function (err) {
        s.togglingId = null
        if (!an.authGuard(err)) alert('更新失敗')
        an.renderList()
      })
      return
    }
    if (action === 'an-delete') {
      if (!window.confirm('確定刪除這則公告？')) return
      var did = target.getAttribute('data-id')
      s.deletingId = did
      an.renderList()
      api('deleteAnnouncement', { token: ap.state.token, id: did }).then(function () {
        s.deletingId = null
        an.syncGlobal()
        an.reload()
      }).catch(function (err) {
        s.deletingId = null
        if (!an.authGuard(err)) alert('刪除失敗')
        an.renderList()
      })
      return
    }
  },

  handleSubmit: function () {
    var s = an.state
    var f = s.form
    if (!f.message.trim()) { alert('請輸入公告內容'); return }
    s.submitting = true
    an.render()
    var req = s.editingId
      ? api('updateAnnouncement', { token: ap.state.token, id: s.editingId, message: f.message, active: f.active })
      : api('addAnnouncement', { token: ap.state.token, message: f.message, active: f.active })
    req.then(function () {
      s.submitting = false
      s.editingId = null
      s.form = { message: '', active: true }
      an.syncGlobal()
      an.reload()
    }).catch(function (err) {
      s.submitting = false
      if (!an.authGuard(err)) alert((s.editingId ? '更新' : '新增') + '失敗: ' + (err.message || ''))
      an.render()
    })
  },
}

/* ============================================================
 * 啟動
 * ============================================================ */
function init() {
  renderShell()
  loadBootstrap().then(function () { if (appState.activeTab === 'book') bf.render() }).catch(function (e) { console.error('Bootstrap 讀取失敗', e) })
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init)
else init()
</script>
